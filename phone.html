<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deepanshu Connect | Premium</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        
        :root {
            --primary: #6366f1;
            --secondary: #ec4899;
            --accent: #8b5cf6;
            --bg: #fdfeff;
        }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: var(--bg); 
            background-image: 
                radial-gradient(at 0% 0%, hsla(253,16%,7%,0) 0, hsla(253,16%,7%,0) 100%), 
                radial-gradient(at 50% 0%, hsla(225,39%,30%,0.05) 0, hsla(225,39%,30%,0) 100%), 
                radial-gradient(at 100% 0%, hsla(339,49%,30%,0.05) 0, hsla(339,49%,30%,0) 100%);
            color: #0f172a;
            min-height: 100vh;
        }

        .premium-glass {
            backdrop-filter: blur(20px) saturate(180%);
            background-color: rgba(255, 255, 255, 0.75);
            border-bottom: 1px solid rgba(203, 213, 225, 0.3);
        }

        .contact-card { 
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            background: #ffffff;
            border: 1px solid rgba(241, 245, 249, 1);
        }

        .contact-card:hover {
            transform: translateY(-5px) scale(1.01);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.08);
            border-color: rgba(99, 102, 241, 0.2);
        }

        .shimmer { 
            background: linear-gradient(90deg, #f8fafc 25%, #f1f5f9 50%, #f8fafc 75%); 
            background-size: 200% 100%; 
            animation: shimmer 2s infinite linear; 
        }

        @keyframes shimmer { 
            0% { background-position: -200% 0; } 
            100% { background-position: 200% 0; } 
        }

        .type-badge {
            font-size: 9px;
            font-weight: 800;
            letter-spacing: 0.05em;
            padding: 4px 10px;
            border-radius: 8px;
            text-transform: uppercase;
        }

        .action-btn {
            transition: all 0.3s ease;
        }

        .action-btn:hover {
            transform: translateY(-2px);
            filter: brightness(1.1);
        }

        .modal-content {
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        input:focus, select:focus {
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="pb-32">

    <!-- Premium Navbar -->
    <header class="sticky top-0 z-50 premium-glass">
        <div class="max-w-2xl mx-auto px-6 py-5 flex justify-between items-center">
            <div class="flex items-center gap-4">
                <div class="relative">
                    <div class="w-12 h-12 bg-indigo-600 rounded-2xl flex items-center justify-center shadow-xl shadow-indigo-200 overflow-hidden">
                        <i class="fa-solid fa-bolt-lightning text-white text-xl"></i>
                    </div>
                    <div class="absolute -top-1 -right-1 w-4 h-4 bg-emerald-500 border-2 border-white rounded-full"></div>
                </div>
                <div>
                    <h1 class="text-xl font-extrabold text-slate-900 tracking-tight">Deepanshu <span class="text-indigo-600">Pro</span></h1>
                    <p class="text-[10px] font-bold text-slate-400 uppercase tracking-[0.2em]">Enterprise Directory</p>
                </div>
            </div>
            <button onclick="refreshData()" class="w-10 h-10 rounded-full border border-slate-200 flex items-center justify-center text-slate-400 hover:text-indigo-600 hover:border-indigo-200 transition-all bg-white shadow-sm">
                <i class="fa-solid fa-arrows-rotate text-sm"></i>
            </button>
        </div>
    </header>

    <!-- Search & Filter Bar -->
    <div class="sticky top-[88px] z-40 px-4 py-4 max-w-2xl mx-auto">
        <div class="bg-white/70 backdrop-blur-xl border border-white rounded-[2.5rem] p-2 shadow-2xl shadow-slate-200/50 space-y-2">
            <div class="relative flex items-center">
                <i class="fa-solid fa-magnifying-glass absolute left-5 top-1/2 -translate-y-1/2 text-slate-300"></i>
                <input type="text" id="searchName" placeholder="Search elite network..." 
                    class="w-full pl-12 pr-12 py-4 bg-transparent border-none focus:ring-0 text-sm font-medium text-slate-700 placeholder:text-slate-300">
                <button id="clearBtn" onclick="clearFilters()" class="absolute right-4 p-2 text-slate-300 hover:text-rose-500 transition-colors hidden" title="Clear all filters">
                    <i class="fa-solid fa-circle-xmark"></i>
                </button>
            </div>
            
            <div class="grid grid-cols-3 gap-2 px-2 pb-2">
                <input list="filter-company-list" id="searchCompany" placeholder="Company" 
                    class="w-full px-4 py-3 bg-slate-50 border-none rounded-2xl text-[11px] font-semibold text-slate-600 focus:bg-white transition-all shadow-inner">
                <datalist id="filter-company-list"></datalist>

                <input list="filter-product-list" id="searchProduct" placeholder="Product" 
                    class="w-full px-4 py-3 bg-slate-50 border-none rounded-2xl text-[11px] font-semibold text-slate-600 focus:bg-white transition-all shadow-inner">
                <datalist id="filter-product-list"></datalist>

                <div class="relative">
                    <select id="searchType" class="w-full px-4 py-3 bg-slate-50 border-none rounded-2xl text-[11px] font-bold text-slate-600 appearance-none focus:bg-white shadow-inner">
                        <option value="">Type: All</option>
                    </select>
                    <i class="fa-solid fa-chevron-down absolute right-4 top-1/2 -translate-y-1/2 text-[10px] text-slate-300 pointer-events-none"></i>
                </div>
            </div>
        </div>
    </div>

    <!-- Content Header -->
    <div class="max-w-2xl mx-auto px-8 mt-6 mb-4 flex justify-between items-end">
        <div>
            <h2 class="text-2xl font-black text-slate-900">Connections</h2>
            <p class="text-xs font-medium text-slate-400">Manage your restaurant ecosystem</p>
        </div>
        <div class="bg-indigo-600 text-white px-4 py-2 rounded-2xl text-[10px] font-black shadow-lg shadow-indigo-200" id="count-badge">
            0 SECURED
        </div>
    </div>

    <!-- Main List -->
    <main class="max-w-2xl mx-auto px-4">
        <!-- Skeleton Loader -->
        <div id="loading-state" class="space-y-4">
            <div class="bg-white p-6 rounded-[2.5rem] border border-slate-50 shadow-sm space-y-4">
                <div class="flex items-center gap-4">
                    <div class="w-16 h-16 rounded-3xl shimmer"></div>
                    <div class="flex-1 space-y-2">
                        <div class="h-5 w-1/3 rounded-lg shimmer"></div>
                        <div class="h-3 w-1/2 rounded-lg shimmer"></div>
                    </div>
                </div>
            </div>
        </div>

        <div id="contacts-container" class="grid grid-cols-1 md:grid-cols-2 gap-4 hidden"></div>

        <!-- No Data -->
        <div id="no-results" class="hidden py-32 text-center bg-white rounded-[3rem] border-2 border-dashed border-slate-100 mx-4 shadow-inner">
            <div class="w-20 h-20 bg-slate-50 rounded-full flex items-center justify-center mx-auto mb-6">
                <i class="fa-solid fa-binoculars text-slate-200 text-2xl"></i>
            </div>
            <h3 class="text-slate-900 font-extrabold text-lg">Empty Directory</h3>
            <p class="text-slate-400 text-sm mt-1">Start adding your elite contacts now.</p>
        </div>
    </main>

    <!-- FAB -->
    <button onclick="openModal()" class="fixed bottom-10 right-8 w-20 h-20 bg-indigo-600 text-white rounded-[2.2rem] shadow-[0_20px_40px_-10px_rgba(79,70,229,0.5)] flex items-center justify-center text-3xl z-50 hover:bg-indigo-700 hover:-translate-y-2 active:scale-90 transition-all">
        <i class="fa-solid fa-plus"></i>
    </button>

    <!-- Form Modal -->
    <div id="modal-overlay" class="fixed inset-0 bg-slate-950/40 backdrop-blur-xl z-[60] hidden flex items-end sm:items-center justify-center p-0 sm:p-4 transition-opacity">
        <div class="modal-content bg-white w-full max-w-xl rounded-t-[3.5rem] sm:rounded-[3rem] shadow-2xl overflow-hidden translate-y-full sm:translate-y-0">
            <div class="p-10">
                <div class="flex justify-between items-center mb-10">
                    <div>
                        <h2 class="text-3xl font-black text-slate-900 tracking-tighter">New Connect</h2>
                        <div class="flex items-center gap-2 mt-1">
                            <span class="w-2 h-2 bg-indigo-500 rounded-full animate-pulse"></span>
                            <p class="text-slate-400 text-sm font-bold uppercase tracking-widest">Adding to secure cloud</p>
                        </div>
                    </div>
                    <button onclick="closeModal()" class="w-12 h-12 bg-slate-50 rounded-2xl flex items-center justify-center text-slate-400 hover:bg-rose-50 hover:text-rose-500 transition-all">
                        <i class="fa-solid fa-xmark text-lg"></i>
                    </button>
                </div>

                <form id="contactForm" class="space-y-6">
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                        <div class="space-y-2">
                            <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1">Phone Identifier</label>
                            <input type="tel" name="phone" required placeholder="00000 00000" class="w-full px-6 py-5 bg-slate-50 border-none rounded-3xl focus:bg-white focus:ring-4 focus:ring-indigo-500/10 text-slate-800 font-bold outline-none transition-all">
                        </div>
                        <div class="space-y-2">
                            <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1">Member Name</label>
                            <input type="text" name="name" required placeholder="Full Identity" class="w-full px-6 py-5 bg-slate-50 border-none rounded-3xl focus:bg-white focus:ring-4 focus:ring-indigo-500/10 text-slate-800 font-bold outline-none transition-all">
                        </div>
                    </div>

                    <div class="space-y-2">
                        <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1">Classification</label>
                        <input list="type-options" name="type" placeholder="Select or define type..." class="w-full px-6 py-5 bg-slate-50 border-none rounded-3xl focus:bg-white focus:ring-4 focus:ring-indigo-500/10 text-slate-800 font-bold outline-none transition-all">
                        <datalist id="type-options"></datalist>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                        <div class="space-y-2">
                            <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1">Corporate</label>
                            <input list="company-options" name="company" placeholder="Entity Name" class="w-full px-6 py-5 bg-slate-50 border-none rounded-3xl focus:bg-white focus:ring-4 focus:ring-indigo-500/10 text-slate-800 font-bold outline-none transition-all">
                            <datalist id="company-options"></datalist>
                        </div>
                        <div class="space-y-2">
                            <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1">Inventory/Product</label>
                            <input list="product-options" name="product" placeholder="Supply item" class="w-full px-6 py-5 bg-slate-50 border-none rounded-3xl focus:bg-white focus:ring-4 focus:ring-indigo-500/10 text-slate-800 font-bold outline-none transition-all">
                            <datalist id="product-options"></datalist>
                        </div>
                    </div>

                    <button type="submit" id="saveBtn" class="w-full bg-slate-900 text-white font-black py-6 rounded-[2.5rem] shadow-2xl hover:bg-indigo-600 hover:-translate-y-1 transition-all flex items-center justify-center gap-3 active:scale-95 group">
                        <i class="fa-solid fa-shield-halved group-hover:rotate-12 transition-transform"></i>
                        <span>AUTHORIZE & SAVE</span>
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- Notification Engine -->
    <div id="toast" class="fixed bottom-12 left-1/2 -translate-x-1/2 px-8 py-5 rounded-[2rem] shadow-2xl text-white font-black text-sm transform translate-y-40 transition-all duration-500 z-[100] flex items-center gap-4 backdrop-blur-xl ${type==='success'?'bg-indigo-600':'bg-rose-600'}"></div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwPjViyvGxafzM45qxYIHIcdTH2_RCg08lyH46UGwJUXxY2z-o25fLb4CZFdmSly8Y/exec"; // SET YOUR API URL HERE
        let allContacts = [];

        window.onload = refreshData;

        async function refreshData() {
            document.getElementById('loading-state').classList.remove('hidden');
            document.getElementById('contacts-container').classList.add('hidden');
            try {
                const [cRes, dRes] = await Promise.all([
                    fetch(`${SCRIPT_URL}?action=getData`),
                    fetch(`${SCRIPT_URL}?action=getDropdownData`)
                ]);
                allContacts = await cRes.json();
                updateUI(await dRes.json());
                renderContacts(allContacts);
            } catch (err) { notify("API CONNECTION FAILED", "error"); }
        }

        function updateUI(data) {
            const populate = (ids, list) => ids.forEach(id => {
                const el = document.getElementById(id);
                if (el.tagName === 'SELECT') {
                    const current = el.value;
                    el.innerHTML = '<option value="">Type: All</option>' + list.map(i => `<option value="${i}">${i}</option>`).join('');
                    el.value = current;
                } else {
                    el.innerHTML = list.map(i => `<option value="${i}">`).join('');
                }
            });
            populate(['type-options', 'searchType'], data.types);
            populate(['company-options', 'filter-company-list'], data.companies);
            populate(['product-options', 'filter-product-list'], data.products);
        }

        function renderContacts(list) {
            document.getElementById('loading-state').classList.add('hidden');
            const container = document.getElementById('contacts-container');
            container.innerHTML = '';
            document.getElementById('count-badge').innerText = `${list.length} SECURED`;
            
            if (list.length === 0) {
                document.getElementById('no-results').classList.remove('hidden');
                container.classList.add('hidden');
                return;
            }
            
            document.getElementById('no-results').classList.add('hidden');
            container.classList.remove('hidden');

            list.forEach(item => {
                const initials = (item.name || '?').split(' ').map(n => n[0]).join('').substring(0,2).toUpperCase();
                const card = document.createElement('div');
                card.className = "contact-card p-6 rounded-[2.8rem] space-y-5";
                
                const typeColor = item.type === 'Vendor' ? 'bg-amber-100 text-amber-700' : 
                                 item.type === 'Client' ? 'bg-emerald-100 text-emerald-700' : 'bg-indigo-50 text-indigo-600';

                card.innerHTML = `
                    <div class="flex items-start justify-between">
                        <div class="flex items-center gap-4">
                            <div class="w-16 h-16 rounded-[1.8rem] bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center text-white text-xl font-black shadow-lg shadow-indigo-100">
                                ${initials}
                            </div>
                            <div>
                                <h3 class="font-extrabold text-slate-900 text-lg leading-tight tracking-tight">${item.name}</h3>
                                <div class="flex items-center gap-2 mt-1">
                                    <span class="type-badge ${typeColor}">${item.type || 'Standard'}</span>
                                    <span class="text-[10px] text-slate-400 font-bold uppercase tracking-widest">${item.company || 'Private'}</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="bg-slate-50 rounded-[2rem] p-5 space-y-3">
                        <div class="flex items-center justify-between text-[11px] font-bold">
                            <div class="flex items-center gap-2 text-slate-500">
                                <i class="fa-solid fa-cube text-indigo-400"></i>
                                <span>${item.product || 'NO ASSET'}</span>
                            </div>
                            <span class="text-slate-300 font-medium">${item.timestamp ? item.timestamp.split(' ')[0] : ''}</span>
                        </div>
                        <div class="flex items-center justify-between px-4 py-3 bg-white rounded-2xl shadow-sm border border-slate-100">
                            <span class="text-sm font-black text-slate-700 tracking-wider">${item.phoneno}</span>
                            <i class="fa-solid fa-fingerprint text-slate-200"></i>
                        </div>
                    </div>

                    <div class="flex gap-2">
                        <a href="tel:${item.phoneno}" class="flex-1 h-14 bg-slate-900 text-white rounded-2xl flex items-center justify-center gap-2 text-xs font-black action-btn">
                            <i class="fa-solid fa-phone"></i>
                        </a>
                        <a href="https://wa.me/${String(item.phoneno).replace(/\D/g,'')}" target="_blank" class="flex-[1.5] h-14 bg-indigo-600 text-white rounded-2xl flex items-center justify-center gap-3 text-xs font-black action-btn shadow-lg shadow-indigo-100">
                            <i class="fa-brands fa-whatsapp text-lg"></i>
                            <span>SECURE CHAT</span>
                        </a>
                        <button onclick="copyClip('${item.phoneno}')" class="flex-1 h-14 bg-white border border-slate-100 text-slate-400 rounded-2xl flex items-center justify-center action-btn">
                            <i class="fa-solid fa-copy"></i>
                        </button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function filter() {
            const n = document.getElementById('searchName').value.toLowerCase();
            const t = document.getElementById('searchType').value.toLowerCase();
            const c = document.getElementById('searchCompany').value.toLowerCase();
            const p = document.getElementById('searchProduct').value.toLowerCase();
            
            // Show/Hide clear button
            const clearBtn = document.getElementById('clearBtn');
            if (n || t || c || p) {
                clearBtn.classList.remove('hidden');
            } else {
                clearBtn.classList.add('hidden');
            }

            const filtered = allContacts.filter(item => 
                (item.name||'').toLowerCase().includes(n) &&
                (item.type||'').toLowerCase().includes(t) &&
                (item.company||'').toLowerCase().includes(c) &&
                (item.product||'').toLowerCase().includes(p)
            );
            renderContacts(filtered);
        }

        function clearFilters() {
            document.getElementById('searchName').value = '';
            document.getElementById('searchCompany').value = '';
            document.getElementById('searchProduct').value = '';
            document.getElementById('searchType').value = '';
            filter(); // Refresh list
        }

        ['searchName', 'searchType', 'searchCompany', 'searchProduct'].forEach(id => document.getElementById(id).addEventListener('input', filter));

        document.getElementById('contactForm').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('saveBtn');
            const original = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin"></i> <span>VALIDATING...</span>`;
            
            const data = Object.fromEntries(new FormData(e.target).entries());
            if (allContacts.some(c => String(c.phoneno).trim() === data.phone.trim())) {
                notify("IDENTITY ALREADY LOGGED", "error");
                btn.disabled = false; btn.innerHTML = original; return;
            }
            try {
                await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(data), headers: { 'Content-Type': 'text/plain' } });
                notify("CONNECTION AUTHORIZED", "success");
                closeModal(); e.target.reset(); refreshData();
            } catch (err) { notify("SYNC TRIGGERED", "success"); closeModal(); refreshData(); }
            btn.disabled = false;
            btn.innerHTML = original;
        };

        function openModal() { 
            const m = document.getElementById('modal-overlay');
            m.classList.remove('hidden');
            document.body.style.overflow = 'hidden';
            setTimeout(() => { m.querySelector('.modal-content').style.transform = "translateY(0)"; m.style.opacity = '1'; }, 10);
        }
        function closeModal() { 
            const m = document.getElementById('modal-overlay');
            m.querySelector('.modal-content').style.transform = "translateY(100%)";
            m.style.opacity = '0';
            document.body.style.overflow = 'auto';
            setTimeout(() => { m.classList.add('hidden'); }, 400);
        }
        function notify(msg, type) {
            const t = document.getElementById('toast');
            if(!t) return;
            t.innerHTML = `<div class="w-10 h-10 rounded-full flex items-center justify-center bg-white/20"><i class="fa-solid ${type==='success'?'fa-shield-check':'fa-shield-exclamation'}"></i></div> <span>${msg}</span>`;
            t.className = `fixed bottom-12 left-1/2 -translate-x-1/2 px-8 py-5 rounded-[2.5rem] shadow-2xl text-white font-black text-xs tracking-widest transition-all duration-500 z-[100] flex items-center gap-4 backdrop-blur-xl ${type==='success'?'bg-indigo-600':'bg-rose-600'}`;
            t.style.transform = "translate(-50%, -20px)";
            setTimeout(() => t.style.transform = "translate(-50%, 200px)", 4000);
        }
        function copyClip(txt) { 
            const el = document.createElement('textarea'); el.value = txt; document.body.appendChild(el); el.select(); document.execCommand('copy'); document.body.removeChild(el);
            notify("IDENTIFIER COPIED", "success");
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Deepanshu Connect | Elite Dark</title>
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="data:application/manifest+json,{%22name%22:%22Deepanshu%20Connect%22,%22short_name%22:%22Connect%22,%22start_url%22:%22.%22,%22display%22:%22standalone%22,%22background_color%22:%22#0f172a%22,%22theme_color%22:%22#f97316%22,%22icons%22:[{%22src%22:%22https://cdn-icons-png.flaticon.com/512/3063/3063822.png%22,%22sizes%22:%22512x512%22,%22type%22:%22image/png%22}]}">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#f97316', // Orange 500
                        slateBg: '#0f172a',
                        cardBg: '#1e293b'
                    }
                }
            }
        }
    </script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        
        :root {
            --primary: #f97316;
            --bg: #0f172a;
            --text: #f1f5f9;
            --card-bg: #1e293b;
            --nav-bg: rgba(15, 23, 42, 0.9);
            --border: #334155;
            --search-bg: #1e293b;
        }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: var(--bg); 
            color: var(--text);
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior: none;
            padding-top: env(safe-area-inset-top);
            padding-bottom: calc(80px + env(safe-area-inset-bottom));
        }

        .premium-glass {
            backdrop-filter: blur(20px) saturate(180%);
            background-color: var(--nav-bg);
        }

        .contact-card { 
            transition: transform 0.1s ease, background-color 0.2s ease;
            background: var(--card-bg);
            border-bottom: 1px solid var(--border);
        }

        .contact-card:active { 
            background-color: #334155;
            transform: scale(0.99);
        }

        .shimmer { 
            background: linear-gradient(90deg, var(--search-bg) 25%, var(--border) 50%, var(--search-bg) 75%); 
            background-size: 200% 100%; 
            animation: shimmer 1.5s infinite linear; 
        }

        @keyframes shimmer { 
            0% { background-position: -200% 0; } 
            100% { background-position: 200% 0; } 
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: calc(70px + env(safe-area-inset-bottom));
            padding-bottom: env(safe-area-inset-bottom);
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid var(--border);
            z-index: 100;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: #64748b;
            font-size: 10px;
            font-weight: 700;
            transition: color 0.2s;
        }

        .nav-item.active {
            color: var(--primary);
        }

        .modal-overlay {
            background-color: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            transition: opacity 0.3s ease;
        }

        .modal-content {
            background-color: var(--card-bg);
            transition: transform 0.4s cubic-bezier(0.2, 1, 0.2, 1);
            max-height: 90vh;
        }

        .ios-search {
            background-color: var(--search-bg);
            border-radius: 16px;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="select-none">

    <!-- Install Prompt -->
    <div id="pwa-banner" class="hidden fixed top-4 inset-x-4 z-[110] animate-bounce">
        <div class="bg-orange-600 text-white rounded-2xl p-4 shadow-2xl flex items-center justify-between">
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-utensils"></i>
                <span class="text-xs font-bold">Install Restaurant App</span>
            </div>
            <button onclick="installPWA()" class="bg-white text-orange-600 px-4 py-2 rounded-lg text-xs font-black">INSTALL</button>
        </div>
    </div>

    <!-- Header -->
    <header class="sticky top-0 z-50 premium-glass px-6 py-4 flex justify-between items-center border-b border-slate-800">
        <div>
            <h1 class="text-xl font-extrabold tracking-tight text-orange-500">Deepanshu</h1>
            <p class="text-[9px] font-black text-slate-500 uppercase tracking-widest leading-none">Restaurant Connect</p>
        </div>
        <div class="flex items-center gap-3">
            <div id="network-status" class="w-2 h-2 rounded-full bg-emerald-500"></div>
            <span class="text-[10px] font-bold text-orange-400" id="count-badge">0 RECORDS</span>
        </div>
    </header>

    <!-- App Search Bar -->
    <div class="px-5 py-4 space-y-3">
        <div class="ios-search flex items-center px-4 py-3 group focus-within:ring-2 focus-within:ring-orange-500/20 transition-all border border-slate-700">
            <i class="fa-solid fa-magnifying-glass text-orange-500 text-sm"></i>
            <input type="text" id="searchName" placeholder="Search contacts..." 
                class="bg-transparent border-none focus:ring-0 w-full text-sm font-semibold ml-3 placeholder:text-slate-500 text-slate-100">
            <button id="clearBtn" onclick="clearFilters()" class="hidden"><i class="fa-solid fa-circle-xmark text-slate-500"></i></button>
        </div>

        <div class="flex gap-2 overflow-x-auto no-scrollbar pb-1">
            <button onclick="clearFilters()" class="bg-slate-800 border border-slate-700 rounded-lg text-[10px] font-bold px-3 py-2 text-rose-400 min-w-fit flex items-center gap-1">
                <i class="fa-solid fa-trash-can"></i> CLEAR
            </button>
            <select id="searchType" class="bg-slate-800 border border-slate-700 rounded-lg text-[10px] font-bold px-3 py-2 text-orange-400 outline-none min-w-fit">
                <option value="">All Types</option>
            </select>
            <input list="filter-company-list" id="searchCompany" placeholder="Company" 
                class="bg-slate-800 border border-slate-700 rounded-lg text-[10px] font-bold px-3 py-2 text-orange-400 outline-none w-24 placeholder:text-slate-600">
            <datalist id="filter-company-list"></datalist>
            <input list="filter-product-list" id="searchProduct" placeholder="Product" 
                class="bg-slate-800 border border-slate-700 rounded-lg text-[10px] font-bold px-3 py-2 text-orange-400 outline-none w-24 placeholder:text-slate-600">
            <datalist id="filter-product-list"></datalist>
        </div>
    </div>

    <!-- Contact List -->
    <main class="max-w-2xl mx-auto">
        <div id="loading-state" class="px-5 space-y-4">
            <div class="flex items-center gap-4 py-4 border-b border-slate-800">
                <div class="w-11 h-11 rounded-full shimmer"></div>
                <div class="flex-1 space-y-2">
                    <div class="h-3 w-1/3 rounded shimmer"></div>
                    <div class="h-2 w-1/2 rounded shimmer"></div>
                </div>
            </div>
        </div>

        <div id="contacts-container" class="hidden"></div>

        <div id="no-results" class="hidden flex flex-col items-center justify-center py-20 text-slate-700">
            <i class="fa-solid fa-address-book text-5xl mb-4"></i>
            <p class="text-sm font-bold uppercase tracking-widest">No Records Found</p>
        </div>
    </main>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav premium-glass">
        <button onclick="refreshData()" class="nav-item active">
            <i class="fa-solid fa-house text-lg"></i>
            <span>Home</span>
        </button>
        <button onclick="openModal()" class="nav-item">
            <div class="w-14 h-14 bg-orange-600 rounded-full flex items-center justify-center -translate-y-5 shadow-xl shadow-orange-900/50 text-white text-xl border-4 border-slate-900">
                <i class="fa-solid fa-plus"></i>
            </div>
            <span class="-translate-y-4">Add New</span>
        </button>
        <button onclick="window.scrollTo({top:0, behavior:'smooth'})" class="nav-item">
            <i class="fa-solid fa-arrow-up text-lg"></i>
            <span>Top</span>
        </button>
    </nav>

    <!-- Bottom Sheet Modal -->
    <div id="modal-overlay" class="fixed inset-0 z-[120] hidden modal-overlay flex items-end">
        <div class="modal-content w-full rounded-t-[2.5rem] shadow-2xl p-8 translate-y-full no-scrollbar overflow-y-auto border-t border-slate-700">
            <div class="flex justify-center mb-6">
                <div class="w-12 h-1.5 bg-slate-700 rounded-full" onclick="closeModal()"></div>
            </div>
            
            <div class="flex justify-between items-center mb-8">
                <h2 class="text-2xl font-black text-orange-500">Authorized Add</h2>
                <button onclick="closeModal()" class="text-slate-600 text-2xl"><i class="fa-solid fa-circle-xmark"></i></button>
            </div>

            <form id="contactForm" class="space-y-5">
                <div class="space-y-4">
                    <div class="space-y-1">
                        <label class="text-[10px] font-black text-slate-500 uppercase tracking-widest ml-1">Phone Number</label>
                        <input type="tel" name="phone" required placeholder="Enter number" class="w-full px-5 py-4 bg-slate-800 rounded-2xl font-bold outline-none focus:bg-slate-700 focus:ring-2 focus:ring-orange-900 transition-all text-slate-100 placeholder:text-slate-600">
                    </div>
                    <div class="space-y-1">
                        <label class="text-[10px] font-black text-slate-500 uppercase tracking-widest ml-1">Full Name</label>
                        <input type="text" name="name" required placeholder="Enter name" class="w-full px-5 py-4 bg-slate-800 rounded-2xl font-bold outline-none focus:bg-slate-700 focus:ring-2 focus:ring-orange-900 transition-all text-slate-100 placeholder:text-slate-600">
                    </div>
                    <div class="space-y-1">
                        <label class="text-[10px] font-black text-slate-500 uppercase tracking-widest ml-1">Type</label>
                        <input list="type-options" name="type" placeholder="Category" class="w-full px-5 py-4 bg-slate-800 rounded-2xl font-bold outline-none text-slate-100 placeholder:text-slate-600">
                        <datalist id="type-options"></datalist>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <input list="company-options" name="company" placeholder="Company" class="w-full px-5 py-4 bg-slate-800 rounded-2xl font-bold outline-none text-slate-100 placeholder:text-slate-600">
                        <datalist id="company-options"></datalist>
                        <input list="product-options" name="product" placeholder="Product" class="w-full px-5 py-4 bg-slate-800 rounded-2xl font-bold outline-none text-slate-100 placeholder:text-slate-600">
                        <datalist id="product-options"></datalist>
                    </div>
                </div>

                <button type="submit" id="saveBtn" class="w-full bg-orange-600 text-white font-black py-5 rounded-2xl shadow-xl hover:bg-orange-700 transition-all active:scale-95 shadow-orange-900/20">
                    SAVE TO DIRECTORY
                </button>
            </form>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed top-12 left-1/2 -translate-x-1/2 px-6 py-3 rounded-full shadow-2xl text-white font-bold text-xs transform -translate-y-40 transition-all duration-500 z-[200] flex items-center gap-2"></div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwPjViyvGxafzM45qxYIHIcdTH2_RCg08lyH46UGwJUXxY2z-o25fLb4CZFdmSly8Y/exec"; // SET YOUR URL
        let allContacts = [];
        let deferredPrompt;

        // PWA Install Prompt
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('pwa-banner').classList.remove('hidden');
        });

        async function installPWA() {
            if (!deferredPrompt) return;
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            if (outcome === 'accepted') document.getElementById('pwa-banner').classList.add('hidden');
            deferredPrompt = null;
        }

        // Network Monitor
        window.addEventListener('online', () => updateNetwork(true));
        window.addEventListener('offline', () => updateNetwork(false));
        function updateNetwork(online) {
            document.getElementById('network-status').className = online ? 'w-2 h-2 rounded-full bg-emerald-500' : 'w-2 h-2 rounded-full bg-rose-500';
            if(!online) notify("Network Disconnected", "error");
        }

        window.onload = refreshData;

        async function refreshData() {
            document.getElementById('loading-state').classList.remove('hidden');
            document.getElementById('contacts-container').classList.add('hidden');
            try {
                const [cRes, dRes] = await Promise.all([
                    fetch(`${SCRIPT_URL}?action=getData`),
                    fetch(`${SCRIPT_URL}?action=getDropdownData`)
                ]);
                allContacts = await cRes.json();
                updateUI(await dRes.json());
                renderContacts(allContacts);
            } catch (err) { notify("Sync Failed", "error"); }
        }

        function updateUI(data) {
            const populate = (ids, list) => ids.forEach(id => {
                const el = document.getElementById(id);
                if (el.tagName === 'SELECT') {
                    el.innerHTML = '<option value="">All Types</option>' + list.map(i => `<option value="${i}">${i}</option>`).join('');
                } else {
                    el.innerHTML = list.map(i => `<option value="${i}">`).join('');
                }
            });
            populate(['type-options', 'searchType'], data.types);
            populate(['company-options', 'filter-company-list'], data.companies);
            populate(['product-options', 'filter-product-list'], data.products);
        }

        function renderContacts(list) {
            document.getElementById('loading-state').classList.add('hidden');
            const container = document.getElementById('contacts-container');
            container.innerHTML = '';
            document.getElementById('count-badge').innerText = `${list.length} RECORDS`;
            
            if (list.length === 0) {
                document.getElementById('no-results').classList.remove('hidden');
                container.classList.add('hidden');
                return;
            }
            
            document.getElementById('no-results').classList.add('hidden');
            container.classList.remove('hidden');

            list.forEach(item => {
                const card = document.createElement('div');
                card.className = "contact-card px-5 py-4 flex items-center justify-between";
                const initials = (item.name || '?').charAt(0).toUpperCase();
                
                card.innerHTML = `
                    <div class="flex items-center gap-4 flex-1 min-w-0">
                        <div class="w-11 h-11 rounded-full bg-orange-600 flex items-center justify-center text-white font-black text-sm shadow-sm">
                            ${initials}
                        </div>
                        <div class="flex-1 min-w-0">
                            <h3 class="font-bold text-slate-100 text-[15px] truncate">${item.name}</h3>
                            <div class="flex items-center gap-2">
                                <span class="text-[10px] font-black text-orange-500 uppercase">${item.type || 'S'}</span>
                                <span class="text-[10px] text-slate-500 truncate font-semibold">${item.company || 'Private'}</span>
                            </div>
                        </div>
                    </div>
                    <div class="flex gap-2">
                        <a href="tel:${item.phoneno}" class="w-10 h-10 bg-slate-800 rounded-full flex items-center justify-center text-orange-500"><i class="fa-solid fa-phone-flip text-xs"></i></a>
                        <a href="https://wa.me/${String(item.phoneno).replace(/\D/g,'')}" target="_blank" class="w-10 h-10 bg-emerald-900/20 rounded-full flex items-center justify-center text-emerald-500"><i class="fa-brands fa-whatsapp text-lg"></i></a>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function filter() {
            const n = document.getElementById('searchName').value.toLowerCase();
            const t = document.getElementById('searchType').value.toLowerCase();
            const c = document.getElementById('searchCompany').value.toLowerCase();
            const p = document.getElementById('searchProduct').value.toLowerCase();
            
            // Show clear button if any field has a value
            document.getElementById('clearBtn').classList.toggle('hidden', !(n || t || c || p));

            const filtered = allContacts.filter(item => 
                (item.name||'').toLowerCase().includes(n) &&
                (item.type||'').toLowerCase().includes(t) &&
                (item.company||'').toLowerCase().includes(c) &&
                (item.product||'').toLowerCase().includes(p)
            );
            renderContacts(filtered);
        }

        function clearFilters() {
            document.getElementById('searchName').value = '';
            document.getElementById('searchType').value = '';
            document.getElementById('searchCompany').value = '';
            document.getElementById('searchProduct').value = '';
            filter();
        }

        ['searchName', 'searchType', 'searchCompany', 'searchProduct'].forEach(id => document.getElementById(id).addEventListener('input', filter));

        document.getElementById('contactForm').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('saveBtn');
            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> SAVING...`;
            
            const data = Object.fromEntries(new FormData(e.target).entries());
            if (allContacts.some(c => String(c.phoneno).trim() === data.phone.trim())) {
                notify("Record Exists", "error");
                btn.disabled = false; btn.innerHTML = "SAVE TO DIRECTORY"; return;
            }
            try {
                await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(data), headers: { 'Content-Type': 'text/plain' } });
                notify("Record Authenticated", "success");
                closeModal(); e.target.reset(); refreshData();
            } catch (err) { refreshData(); closeModal(); }
            btn.disabled = false;
        };

        function openModal() { 
            const m = document.getElementById('modal-overlay');
            m.classList.remove('hidden');
            setTimeout(() => { 
                m.querySelector('.modal-content').classList.remove('translate-y-full');
            }, 10);
        }
        function closeModal() { 
            const m = document.getElementById('modal-overlay');
            m.querySelector('.modal-content').classList.add('translate-y-full');
            setTimeout(() => { m.classList.add('hidden'); }, 300);
        }
        function notify(msg, type) {
            const t = document.getElementById('toast');
            t.innerHTML = `<i class="fa-solid ${type==='success'?'fa-check-circle':'fa-circle-exclamation'}"></i> <span>${msg}</span>`;
            t.className = `fixed top-12 left-1/2 -translate-x-1/2 px-6 py-3 rounded-full shadow-2xl text-white font-bold text-xs transform transition-all duration-500 z-[200] flex items-center gap-2 ${type==='success'?'bg-orange-600':'bg-rose-600'}`;
            t.style.transform = "translate(-50%, 0)";
            setTimeout(() => t.style.transform = "translate(-50%, -200px)", 3000);
        }
    </script>
</body>
</html>

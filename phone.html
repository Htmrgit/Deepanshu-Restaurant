<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Deepanshu Connect | Elite</title>
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#6366f1">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="data:application/manifest+json,{%22name%22:%22Deepanshu%20Connect%22,%22short_name%22:%22Connect%22,%22start_url%22:%22.%22,%22display%22:%22standalone%22,%22background_color%22:%22#ffffff%22,%22theme_color%22:%22#6366f1%22,%22icons%22:[{%22src%22:%22https://cdn-icons-png.flaticon.com/512/3063/3063822.png%22,%22sizes%22:%22512x512%22,%22type%22:%22image/png%22}]}">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        
        :root {
            --primary: #6366f1;
            --bg: #fdfbff;
        }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: var(--bg); 
            color: #0f172a;
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior-y: contain;
        }

        .premium-glass {
            backdrop-filter: blur(12px) saturate(160%);
            background-color: rgba(255, 255, 255, 0.85);
            border-bottom: 1px solid rgba(226, 232, 240, 0.5);
        }

        .contact-card { 
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            background: #ffffff;
            border: 1px solid rgba(241, 245, 249, 1);
        }

        .contact-card:active { 
            transform: scale(0.96); 
        }

        .shimmer { 
            background: linear-gradient(90deg, #f8fafc 25%, #f1f5f9 50%, #f8fafc 75%); 
            background-size: 200% 100%; 
            animation: shimmer 1.5s infinite linear; 
        }

        @keyframes shimmer { 
            0% { background-position: -200% 0; } 
            100% { background-position: 200% 0; } 
        }

        .action-btn {
            transition: transform 0.2s ease;
        }

        .action-btn:active {
            transform: translateY(2px);
        }

        /* App-like Modal */
        .modal-content {
            transition: transform 0.4s cubic-bezier(0.32, 1, 0.2, 1);
        }

        .install-banner {
            animation: slideDown 0.5s ease-out;
        }

        @keyframes slideDown {
            from { transform: translateY(-100%); }
            to { transform: translateY(0); }
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="pb-32 select-none">

    <!-- PWA Install Banner (Hidden by default) -->
    <div id="pwa-banner" class="hidden install-banner fixed top-0 inset-x-0 z-[100] p-4">
        <div class="bg-indigo-600 text-white rounded-2xl p-4 shadow-2xl flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-white/20 rounded-xl flex items-center justify-center">
                    <i class="fa-solid fa-mobile-screen-button"></i>
                </div>
                <div>
                    <p class="text-xs font-bold uppercase tracking-wider">Install App</p>
                    <p class="text-[10px] opacity-80 font-medium">Add to your home screen</p>
                </div>
            </div>
            <div class="flex gap-2">
                <button onclick="hideInstallBanner()" class="px-3 py-2 text-xs font-bold bg-white/10 rounded-lg">Later</button>
                <button onclick="installPWA()" class="px-4 py-2 text-xs font-bold bg-white text-indigo-600 rounded-lg">Install</button>
            </div>
        </div>
    </div>

    <!-- Top Bar -->
    <header class="sticky top-0 z-50 premium-glass">
        <div class="max-w-2xl mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center shadow-lg shadow-indigo-100">
                    <i class="fa-solid fa-bolt text-white text-lg"></i>
                </div>
                <div>
                    <h1 class="text-lg font-extrabold text-slate-900 tracking-tight leading-none">Deepanshu</h1>
                    <p class="text-[9px] font-black text-indigo-500 uppercase tracking-[0.2em] mt-1">Connect Pro</p>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <div id="network-status" class="w-2 h-2 rounded-full bg-emerald-500" title="Online"></div>
                <button onclick="refreshData()" class="w-10 h-10 rounded-xl border border-slate-100 flex items-center justify-center text-slate-400 hover:text-indigo-600 transition-all bg-white shadow-sm">
                    <i class="fa-solid fa-rotate text-sm"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Filter Section (Optimized for Low-end Screens) -->
    <div class="sticky top-[73px] z-40 px-4 py-3 max-w-2xl mx-auto">
        <div class="bg-white/80 backdrop-blur-md border border-slate-100 rounded-[2rem] p-1.5 shadow-xl shadow-slate-200/40 space-y-1.5">
            <div class="relative flex items-center">
                <i class="fa-solid fa-search absolute left-5 top-1/2 -translate-y-1/2 text-slate-300 text-xs"></i>
                <input type="text" id="searchName" placeholder="Search contact..." 
                    class="w-full pl-11 pr-11 py-3.5 bg-transparent border-none focus:ring-0 text-sm font-semibold text-slate-700 placeholder:text-slate-300">
                <button id="clearBtn" onclick="clearFilters()" class="absolute right-4 p-2 text-slate-300 hover:text-rose-500 hidden transition-colors">
                    <i class="fa-solid fa-circle-xmark"></i>
                </button>
            </div>
            
            <div class="grid grid-cols-3 gap-1.5 px-1.5 pb-1.5">
                <input list="filter-company-list" id="searchCompany" placeholder="Co." 
                    class="w-full px-3 py-2.5 bg-slate-50 border-none rounded-xl text-[10px] font-bold text-slate-600 focus:bg-white transition-all">
                <datalist id="filter-company-list"></datalist>

                <input list="filter-product-list" id="searchProduct" placeholder="Prod." 
                    class="w-full px-3 py-2.5 bg-slate-50 border-none rounded-xl text-[10px] font-bold text-slate-600 focus:bg-white transition-all">
                <datalist id="filter-product-list"></datalist>

                <div class="relative">
                    <select id="searchType" class="w-full px-3 py-2.5 bg-slate-50 border-none rounded-xl text-[10px] font-bold text-slate-600 appearance-none focus:bg-white">
                        <option value="">All</option>
                    </select>
                    <i class="fa-solid fa-caret-down absolute right-3 top-1/2 -translate-y-1/2 text-[9px] text-slate-300 pointer-events-none"></i>
                </div>
            </div>
        </div>
    </div>

    <!-- Info Bar -->
    <div class="max-w-2xl mx-auto px-7 mt-6 mb-4 flex justify-between items-center">
        <h2 class="text-xs font-black text-slate-400 uppercase tracking-widest">Directory</h2>
        <span class="text-[10px] font-black bg-indigo-50 text-indigo-600 px-3 py-1 rounded-lg" id="count-badge">0 RECORDS</span>
    </div>

    <!-- Contact List -->
    <main class="max-w-2xl mx-auto px-4 min-h-[50vh]">
        <div id="loading-state" class="space-y-4">
            <div class="bg-white p-5 rounded-[2rem] border border-slate-50 space-y-4">
                <div class="flex items-center gap-4">
                    <div class="w-14 h-14 rounded-2xl shimmer"></div>
                    <div class="flex-1 space-y-2">
                        <div class="h-4 w-1/3 rounded-md shimmer"></div>
                        <div class="h-3 w-1/2 rounded-md shimmer"></div>
                    </div>
                </div>
            </div>
        </div>

        <div id="contacts-container" class="grid grid-cols-1 md:grid-cols-2 gap-4 hidden"></div>

        <!-- No Data State -->
        <div id="no-results" class="hidden py-24 text-center bg-white rounded-[2.5rem] border border-slate-100 mx-2">
            <div class="w-16 h-16 bg-slate-50 rounded-full flex items-center justify-center mx-auto mb-4">
                <i class="fa-solid fa-search-minus text-slate-200 text-xl"></i>
            </div>
            <p class="text-slate-400 text-xs font-bold uppercase tracking-widest">No entries found</p>
        </div>
    </main>

    <!-- Floating Add Button -->
    <button onclick="openModal()" class="fixed bottom-10 right-8 w-16 h-16 bg-indigo-600 text-white rounded-2xl shadow-xl shadow-indigo-200 flex items-center justify-center text-2xl z-50 active:scale-90 transition-all">
        <i class="fa-solid fa-plus"></i>
    </button>

    <!-- Modal (App Style) -->
    <div id="modal-overlay" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-[60] hidden flex items-end sm:items-center justify-center p-0 sm:p-4 transition-opacity duration-300">
        <div class="modal-content bg-white w-full max-w-xl rounded-t-[3rem] sm:rounded-[2.5rem] shadow-2xl overflow-hidden translate-y-full">
            <div class="p-8">
                <div class="flex justify-between items-center mb-8">
                    <div>
                        <h2 class="text-2xl font-black text-slate-900 tracking-tight">New Contact</h2>
                        <p class="text-[10px] font-bold text-slate-400 uppercase mt-1">Cloud Secure Authorization</p>
                    </div>
                    <button onclick="closeModal()" class="w-10 h-10 bg-slate-50 rounded-xl flex items-center justify-center text-slate-400">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>

                <form id="contactForm" class="space-y-4">
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div class="space-y-1">
                            <label class="text-[9px] font-black text-slate-400 uppercase tracking-widest ml-1">Phone</label>
                            <input type="tel" name="phone" required placeholder="00000 00000" class="w-full px-5 py-4 bg-slate-50 rounded-2xl focus:bg-white text-sm font-bold outline-none border border-transparent focus:border-indigo-100 transition-all">
                        </div>
                        <div class="space-y-1">
                            <label class="text-[9px] font-black text-slate-400 uppercase tracking-widest ml-1">Full Name</label>
                            <input type="text" name="name" required placeholder="Identity Name" class="w-full px-5 py-4 bg-slate-50 rounded-2xl focus:bg-white text-sm font-bold outline-none border border-transparent focus:border-indigo-100 transition-all">
                        </div>
                    </div>

                    <div class="space-y-1">
                        <label class="text-[9px] font-black text-slate-400 uppercase tracking-widest ml-1">Type</label>
                        <input list="type-options" name="type" placeholder="Category" class="w-full px-5 py-4 bg-slate-50 rounded-2xl focus:bg-white text-sm font-bold outline-none border border-transparent focus:border-indigo-100 transition-all">
                        <datalist id="type-options"></datalist>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <input list="company-options" name="company" placeholder="Company Name" class="w-full px-5 py-4 bg-slate-50 rounded-2xl text-sm font-bold outline-none border border-transparent focus:border-indigo-100">
                        <datalist id="company-options"></datalist>
                        <input list="product-options" name="product" placeholder="Product Type" class="w-full px-5 py-4 bg-slate-50 rounded-2xl text-sm font-bold outline-none border border-transparent focus:border-indigo-100">
                        <datalist id="product-options"></datalist>
                    </div>

                    <button type="submit" id="saveBtn" class="w-full bg-slate-900 text-white font-black py-5 rounded-2xl shadow-xl hover:bg-indigo-600 transition-all flex items-center justify-center gap-3 active:scale-95 mt-4">
                        <i class="fa-solid fa-cloud-check"></i>
                        <span>SAVE TO DIRECTORY</span>
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="fixed bottom-10 left-1/2 -translate-x-1/2 px-6 py-4 rounded-2xl shadow-2xl text-white font-black text-xs transform translate-y-40 transition-all duration-500 z-[100] flex items-center gap-3 backdrop-blur-md"></div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwPjViyvGxafzM45qxYIHIcdTH2_RCg08lyH46UGwJUXxY2z-o25fLb4CZFdmSly8Y/exec"; // SET YOUR API URL HERE
        let allContacts = [];
        let deferredPrompt;

        // PWA Install Logic
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('pwa-banner').classList.remove('hidden');
        });

        async function installPWA() {
            if (!deferredPrompt) return;
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            if (outcome === 'accepted') hideInstallBanner();
            deferredPrompt = null;
        }

        function hideInstallBanner() {
            document.getElementById('pwa-banner').classList.add('hidden');
        }

        // Network Monitor
        window.addEventListener('online', () => updateNetworkStatus(true));
        window.addEventListener('offline', () => updateNetworkStatus(false));

        function updateNetworkStatus(online) {
            const dot = document.getElementById('network-status');
            dot.className = online ? 'w-2 h-2 rounded-full bg-emerald-500' : 'w-2 h-2 rounded-full bg-rose-500';
            if(!online) notify("You are offline", "error");
        }

        window.onload = refreshData;

        async function refreshData() {
            document.getElementById('loading-state').classList.remove('hidden');
            document.getElementById('contacts-container').classList.add('hidden');
            try {
                const [cRes, dRes] = await Promise.all([
                    fetch(`${SCRIPT_URL}?action=getData`),
                    fetch(`${SCRIPT_URL}?action=getDropdownData`)
                ]);
                allContacts = await cRes.json();
                updateUI(await dRes.json());
                renderContacts(allContacts);
            } catch (err) { notify("API Connect Failed", "error"); }
        }

        function updateUI(data) {
            const populate = (ids, list) => ids.forEach(id => {
                const el = document.getElementById(id);
                if (el.tagName === 'SELECT') {
                    const current = el.value;
                    el.innerHTML = '<option value="">All</option>' + list.map(i => `<option value="${i}">${i}</option>`).join('');
                    el.value = current;
                } else {
                    el.innerHTML = list.map(i => `<option value="${i}">`).join('');
                }
            });
            populate(['type-options', 'searchType'], data.types);
            populate(['company-options', 'filter-company-list'], data.companies);
            populate(['product-options', 'filter-product-list'], data.products);
        }

        function renderContacts(list) {
            document.getElementById('loading-state').classList.add('hidden');
            const container = document.getElementById('contacts-container');
            container.innerHTML = '';
            document.getElementById('count-badge').innerText = `${list.length} RECORDS`;
            
            if (list.length === 0) {
                document.getElementById('no-results').classList.remove('hidden');
                container.classList.add('hidden');
                return;
            }
            
            document.getElementById('no-results').classList.add('hidden');
            container.classList.remove('hidden');

            list.forEach(item => {
                const initials = (item.name || '?').split(' ').map(n => n[0]).join('').substring(0,2).toUpperCase();
                const card = document.createElement('div');
                card.className = "contact-card p-5 rounded-[2.2rem] space-y-4 shadow-sm";
                
                const typeColor = item.type === 'Vendor' ? 'bg-amber-100 text-amber-600' : 
                                 item.type === 'Client' ? 'bg-emerald-100 text-emerald-600' : 'bg-indigo-50 text-indigo-500';

                card.innerHTML = `
                    <div class="flex items-center gap-4">
                        <div class="w-14 h-14 rounded-2xl bg-slate-900 flex items-center justify-center text-white text-lg font-black">
                            ${initials}
                        </div>
                        <div class="flex-1 min-w-0">
                            <h3 class="font-extrabold text-slate-900 text-base truncate">${item.name}</h3>
                            <div class="flex items-center gap-2 mt-1">
                                <span class="px-2 py-0.5 ${typeColor} rounded-md text-[9px] font-black uppercase tracking-wider">${item.type || 'S'}</span>
                                <span class="text-[10px] text-slate-400 font-bold truncate">${item.company || 'Private Entity'}</span>
                            </div>
                        </div>
                    </div>

                    <div class="bg-slate-50 rounded-2xl p-4 space-y-2">
                        <div class="flex justify-between items-center text-[10px] font-black text-slate-400">
                            <div class="flex items-center gap-1.5">
                                <i class="fa-solid fa-layer-group text-indigo-400"></i>
                                <span>${item.product || 'NO PRODUCT'}</span>
                            </div>
                            <span class="opacity-40 uppercase">${item.timestamp ? item.timestamp.split(' ')[0] : ''}</span>
                        </div>
                        <div class="flex justify-between items-center bg-white border border-slate-100 p-2 rounded-xl">
                            <span class="text-xs font-black text-slate-800 tracking-wider">${item.phoneno}</span>
                            <i class="fa-solid fa-lock text-[9px] text-slate-200"></i>
                        </div>
                    </div>

                    <div class="flex gap-1.5">
                        <a href="tel:${item.phoneno}" class="flex-1 h-12 bg-slate-900 text-white rounded-xl flex items-center justify-center action-btn">
                            <i class="fa-solid fa-phone text-sm"></i>
                        </a>
                        <a href="https://wa.me/${String(item.phoneno).replace(/\D/g,'')}" target="_blank" class="flex-[2] h-12 bg-indigo-600 text-white rounded-xl flex items-center justify-center gap-2 text-[11px] font-black action-btn shadow-lg shadow-indigo-100">
                            <i class="fa-brands fa-whatsapp text-base"></i>
                            <span>WHATSAPP</span>
                        </a>
                        <button onclick="copyClip('${item.phoneno}')" class="flex-1 h-12 bg-white border border-slate-100 text-slate-300 rounded-xl flex items-center justify-center action-btn">
                            <i class="fa-solid fa-copy text-sm"></i>
                        </button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function filter() {
            const n = document.getElementById('searchName').value.toLowerCase();
            const t = document.getElementById('searchType').value.toLowerCase();
            const c = document.getElementById('searchCompany').value.toLowerCase();
            const p = document.getElementById('searchProduct').value.toLowerCase();
            const clearBtn = document.getElementById('clearBtn');
            (n || t || c || p) ? clearBtn.classList.remove('hidden') : clearBtn.classList.add('hidden');

            const filtered = allContacts.filter(item => 
                (item.name||'').toLowerCase().includes(n) &&
                (item.type||'').toLowerCase().includes(t) &&
                (item.company||'').toLowerCase().includes(c) &&
                (item.product||'').toLowerCase().includes(p)
            );
            renderContacts(filtered);
        }

        function clearFilters() {
            ['searchName', 'searchCompany', 'searchProduct', 'searchType'].forEach(id => document.getElementById(id).value = '');
            filter();
        }

        ['searchName', 'searchType', 'searchCompany', 'searchProduct'].forEach(id => document.getElementById(id).addEventListener('input', filter));

        document.getElementById('contactForm').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('saveBtn');
            const original = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> <span>SYNCING...</span>`;
            
            const data = Object.fromEntries(new FormData(e.target).entries());
            if (allContacts.some(c => String(c.phoneno).trim() === data.phone.trim())) {
                notify("Record Already Exists", "error");
                btn.disabled = false; btn.innerHTML = original; return;
            }
            try {
                await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(data), headers: { 'Content-Type': 'text/plain' } });
                notify("Connection Authorized", "success");
                closeModal(); e.target.reset(); refreshData();
            } catch (err) { notify("Refreshing List...", "success"); closeModal(); refreshData(); }
            btn.disabled = false; btn.innerHTML = original;
        };

        function openModal() { 
            const m = document.getElementById('modal-overlay');
            m.classList.remove('hidden');
            setTimeout(() => { m.querySelector('.modal-content').classList.replace('translate-y-full', 'translate-y-0'); m.classList.add('opacity-100'); }, 10);
        }
        function closeModal() { 
            const m = document.getElementById('modal-overlay');
            m.querySelector('.modal-content').classList.replace('translate-y-0', 'translate-y-full');
            setTimeout(() => { m.classList.add('hidden'); }, 300);
        }
        function notify(msg, type) {
            const t = document.getElementById('toast');
            t.innerHTML = `<i class="fa-solid ${type==='success'?'fa-check-circle':'fa-circle-exclamation'}"></i> <span>${msg}</span>`;
            t.className = `fixed bottom-10 left-1/2 -translate-x-1/2 px-6 py-4 rounded-2xl shadow-2xl text-white font-black text-xs tracking-widest transition-all duration-500 z-[100] flex items-center gap-3 ${type==='success'?'bg-slate-900':'bg-rose-600'}`;
            t.style.transform = "translate(-50%, -10px)";
            setTimeout(() => t.style.transform = "translate(-50%, 200px)", 4000);
        }
        function copyClip(txt) { 
            const el = document.createElement('textarea'); el.value = txt; document.body.appendChild(el); el.select(); document.execCommand('copy'); document.body.removeChild(el);
            notify("Number Copied", "success");
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEEPANSHU Restaurant - Order Online</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --brand-primary: #f59e0b;
            --brand-secondary: #0f172a;
        }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #fdfdfd;
            background-image: radial-gradient(#e2e8f0 0.5px, transparent 0.5px);
            background-size: 24px 24px;
        }
        .glass {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(226, 232, 240, 0.8);
        }
        .category-pill.active {
            background-color: var(--brand-secondary);
            color: white;
            box-shadow: 0 10px 15px -3px rgba(15, 23, 42, 0.2);
            transform: translateY(-2px);
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .accordion-content {
            display: grid;
            grid-template-rows: 0fr;
            transition: grid-template-rows 0.3s ease-out, opacity 0.2s ease;
            opacity: 0;
        }
        .accordion-content.open {
            grid-template-rows: 1fr;
            opacity: 1;
        }
        .accordion-inner { overflow: hidden; }
        .rotate-icon { transition: transform 0.3s ease; }
        .rotate-icon.open { transform: rotate(180deg); }

        .veg-dot { width: 10px; height: 10px; border: 1.5px solid #16a34a; padding: 1.5px; display: inline-flex; align-items: center; justify-content: center; border-radius: 2px; }
        .veg-dot::after { content: ''; width: 100%; height: 100%; background: #16a34a; border-radius: 50%; }
        .non-veg-dot { width: 10px; height: 10px; border: 1.5px solid #dc2626; padding: 1.5px; display: inline-flex; align-items: center; justify-content: center; border-radius: 2px; }
        .non-veg-dot::after { content: ''; width: 100%; height: 100%; background: #dc2626; border-radius: 50%; }

        #cartPanel {
            transform: translateY(100%);
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        #cartPanel.open { transform: translateY(0); }
        .modal-overlay {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(4px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .modal-overlay.open { opacity: 1; pointer-events: auto; }
    </style>
</head>
<body class="text-slate-900 pb-32">

            </div>

            <div class="relative max-w-md mx-auto">
                <div class="absolute inset-y-0 left-4 flex items-center">
                    <svg class="w-5 h-5 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" stroke-width="2.5"/></svg>
                </div>
                <input type="text" id="searchInput" placeholder="Search delicious food..."

    </header>

        <div id="menuContent" class="space-y-8">

                <div class="w-8 h-8 border-4 border-amber-500 border-t-transparent rounded-full animate-spin"></div>
            </div>
        </div>
    </main>

    <!-- Cart Summary Bar -->
    <div id="cartSummary" class="fixed bottom-0 inset-x-0 p-4 z-40 bg-white border-t border-slate-100 shadow-[0_-10px_25px_-5px_rgba(0,0,0,0.1)] hidden">

            </div>
            <button onclick="toggleCart(true)" class="bg-amber-500 hover:bg-amber-400 text-slate-900 font-black px-6 py-2.5 rounded-xl transition-all flex items-center gap-2">

            </button>
        </div>
    </div>

    <!-- Variant Selection Modal -->
    <div id="variantModalOverlay" class="modal-overlay fixed inset-0 z-[60] flex items-end sm:items-center justify-center p-4">
        <div id="variantModal" class="bg-white w-full max-w-sm rounded-[2rem] p-6 shadow-2xl transform transition-all translate-y-10">
            <div class="flex justify-between items-start mb-4">
                <div>
                    <h3 id="vModalTitle" class="text-xl font-black text-slate-900 uppercase">Item Name</h3>
                    <p class="text-xs text-slate-400 font-bold uppercase tracking-widest mt-1">Select Size / Variant</p>
                </div>
                <button onclick="closeVariantModal()" class="text-slate-300 hover:text-slate-600"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M6 18L18 6M6 6l12 12" stroke-width="2.5"/></svg></button>
            </div>
            <div id="vModalOptions" class="space-y-3 mb-6"></div>
        </div>
    </div>

    <!-- Full Cart Panel -->
    <div id="cartPanelOverlay" class="modal-overlay fixed inset-0 z-50"></div>
    <div id="cartPanel" class="fixed bottom-0 inset-x-0 z-[55] bg-white rounded-t-[2.5rem] shadow-2xl max-h-[90vh] flex flex-col">
        <div class="p-6 border-b border-slate-50 flex justify-between items-center">
            <div class="flex items-center gap-4">
                <h2 class="text-2xl font-black text-slate-900 uppercase">Your Order</h2>
                <button onclick="clearAllCart()" class="text-[10px] font-bold text-red-500 border border-red-200 px-2 py-1 rounded-lg uppercase tracking-widest">Clear All</button>
            </div>
            <button onclick="toggleCart(false)" class="bg-slate-100 p-2 rounded-full text-slate-400"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M6 18L18 6M6 6l12 12" stroke-width="3"/></svg></button>
        </div>
        
        <div id="cartItems" class="flex-1 overflow-y-auto p-6 space-y-4"></div>

        <div class="p-6 bg-slate-50 space-y-4 shadow-[0_-4px_10px_rgba(0,0,0,0.05)]">
            <!-- User Info -->
            <div class="grid grid-cols-2 gap-3">
                <input type="text" id="orderName" placeholder="Your Name" class="w-full p-4 rounded-xl border-2 border-slate-100 font-bold text-sm outline-none focus:border-amber-400">
                <input type="tel" id="orderPhone" placeholder="Phone Number" class="w-full p-4 rounded-xl border-2 border-slate-100 font-bold text-sm outline-none focus:border-amber-400">
            </div>
            
            <!-- Timing Selection -->
            <div class="grid grid-cols-2 gap-3">
                <div class="flex flex-col gap-1">
                    <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest ml-1">Type</label>
                    <select id="orderType" class="w-full p-4 rounded-xl border-2 border-slate-100 font-bold text-sm outline-none bg-white">
                        <option value="Delivery">Home Delivery</option>
                        <option value="Pickup">Pickup</option>
                    </select>
                </div>
                <div class="flex flex-col gap-1">
                    <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest ml-1">Order Timing</label>
                    <select id="scheduleType" onchange="toggleScheduleInput()" class="w-full p-4 rounded-xl border-2 border-slate-100 font-bold text-sm outline-none bg-white">
                        <option value="Immediate">Order Now</option>
                        <option value="Scheduled">Schedule Later</option>
                    </select>
                </div>
            </div>

            <!-- Schedule Input -->
            <div id="scheduleInputContainer" class="hidden animate-pulse">
                 <input type="datetime-local" id="scheduleTime" class="w-full p-4 rounded-xl border-2 border-amber-200 bg-amber-50 font-bold text-sm outline-none">
            </div>

            <button onclick="placeOrder()" class="w-full bg-green-500 hover:bg-green-600 text-white font-black py-5 rounded-2xl flex items-center justify-center gap-3 shadow-xl shadow-green-100 transition-all active:scale-95">
                PLACE ORDER ON WHATSAPP
            </button>
        </div>
    </div>

    <!-- Credits -->

        <p class="text-[10px] font-bold text-slate-300 uppercase tracking-[0.4em] mb-4">Developed By</p>
        <a href="https://manohar.marketingub.in/" target="_blank" class="text-sm font-black text-slate-800 hover:text-amber-500 transition-colors uppercase">THAKUR MANO RAJPUT</a>
        <p class="mt-4 text-[9px] text-slate-300 uppercase">© 2024 DEEPANSHU RESTAURANT • INDIRAPURAM</p>
    </footer>

        let cart = [];
        const menuContent = document.getElementById('menuContent');
        const categoryTabs = document.getElementById('categoryTabs');
        const searchInput = document.getElementById('searchInput');

        // Load saved user info
        window.onload = () => {
            const savedName = localStorage.getItem('deepanshu_name');
            const savedPhone = localStorage.getItem('deepanshu_phone');
            if (savedName) document.getElementById('orderName').value = savedName;
            if (savedPhone) document.getElementById('orderPhone').value = savedPhone;
            renderMenu();
        };

        function isNonVeg(name) {
            const nvKeywords = ['chicken', 'mutton', 'egg', 'keema', 'meat', 'wings', 'lollipop', 'tangri', 'fish'];
            return nvKeywords.some(k => name.toLowerCase().includes(k));
        }

        function renderMenu(query = '') {
            const filteredData = menuData.menu.map(cat => ({
                ...cat,
                items: cat.items.filter(item => 
                    item.name.toLowerCase().includes(query.toLowerCase()) || cat.category.toLowerCase().includes(query.toLowerCase())
                )
            })).filter(cat => cat.items.length > 0);

            categoryTabs.innerHTML = filteredData.map((cat, idx) => `
                <button onclick="scrollToCategory('cat-${idx}')" class="category-pill whitespace-nowrap px-6 py-2.5 rounded-2xl text-[11px] font-black uppercase tracking-widest border-2 border-slate-100 bg-white text-slate-400">
                    ${cat.category}
                </button>
            `).join('');

            menuContent.innerHTML = filteredData.map((cat, idx) => `
                <section id="cat-${idx}" class="scroll-mt-48">
                    <button onclick="toggleSection(this)" class="w-full flex items-center justify-between p-2">
                        <h2 class="text-lg font-black text-slate-800 uppercase tracking-tighter flex items-center gap-2">

                            ${cat.category}
                        </h2>
                        <div class="rotate-icon open text-slate-300"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M19 9l-7 7-7-7" stroke-width="3"/></svg></div>
                    </button>
                    <div class="accordion-content open mt-4">
                        <div class="accordion-inner space-y-3">
                            ${cat.items.map(item => `
                                <div class="bg-white p-5 rounded-[2rem] border border-slate-100 shadow-sm flex justify-between items-center gap-4">
                                    <div class="flex-1">
                                        <div class="flex items-center gap-2 mb-1">
                                            <span class="${isNonVeg(item.name) ? 'non-veg-dot' : 'veg-dot'}"></span>
                                            <h3 class="text-sm font-extrabold text-slate-800 leading-tight">${item.name}</h3>
                                        </div>
                                        <p class="text-[14px] font-black text-amber-500">₹${typeof item.price === 'string' ? item.price : Object.values(item.price)[0] + '+'}</p>
                                    </div>
                                    <button onclick='handleAddToCart(${JSON.stringify(item)})' class="bg-slate-900 text-white px-5 py-2.5 rounded-xl font-black text-xs transition-all active:scale-90">ADD</button>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </section>
            `).join('');
            updateActiveTab();
        }

        function handleAddToCart(item) {
            if (typeof item.price === 'string') {
                addToCart(item.name, item.price, 'Standard');
            } else {
                openVariantModal(item);
            }
        }

        function openVariantModal(item) {
            document.getElementById('vModalTitle').innerText = item.name;
            const options = Object.entries(item.price).map(([key, price]) => `
                <button onclick="addToCart('${item.name}', '${price}', '${key}'); closeVariantModal();" 
                    class="w-full flex justify-between items-center p-4 bg-slate-50 hover:bg-amber-50 border-2 border-transparent hover:border-amber-200 rounded-2xl transition-all">
                    <span class="font-bold text-slate-700">${key}</span>
                    <span class="font-black text-slate-900">₹${price}</span>
                </button>
            `).join('');
            document.getElementById('vModalOptions').innerHTML = options;
            document.getElementById('variantModalOverlay').classList.add('open');
            document.getElementById('variantModal').classList.remove('translate-y-10');
        }

        function closeVariantModal() {
            document.getElementById('variantModalOverlay').classList.remove('open');
            document.getElementById('variantModal').classList.add('translate-y-10');
        }

        function addToCart(name, price, variant) {
            const existing = cart.find(i => i.name === name && i.variant === variant);
            if (existing) {
                existing.qty++;
            } else {
                cart.push({ name, price: parseFloat(price), variant, qty: 1 });
            }
            updateUI();
        }

        function updateUI() {
            const count = cart.reduce((sum, item) => sum + item.qty, 0);
            const total = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            document.getElementById('cartSummary').classList.toggle('hidden', count === 0);
            document.getElementById('cartCount').innerText = `${count} Items`;
            document.getElementById('cartTotal').innerText = `₹${total.toFixed(2)}`;
            renderCartItems();
        }

        function renderCartItems() {
            const container = document.getElementById('cartItems');
            if (cart.length === 0) {
                container.innerHTML = `<div class="text-center py-10 space-y-4">
                    <p class="text-slate-400 font-bold uppercase tracking-widest text-xs">Your cart is empty</p>
                    <button onclick="toggleCart(false)" class="text-amber-500 font-black text-sm">Return to Menu</button>
                </div>`;
                return;
            }
            container.innerHTML = cart.map((item, idx) => `
                <div class="flex justify-between items-center gap-4 bg-slate-50 p-4 rounded-3xl border border-slate-100">
                    <div class="flex-1">
                        <h4 class="text-sm font-black text-slate-900 leading-tight">${item.name}</h4>
                        <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">${item.variant}</p>
                        <p class="text-xs font-black text-amber-500 mt-1">₹${(item.price * item.qty).toFixed(2)}</p>
                    </div>
                    <div class="flex items-center gap-2">
                        <div class="flex items-center gap-3 bg-white border border-slate-100 p-1.5 rounded-xl">
                            <button onclick="updateQty(${idx}, -1)" class="w-6 h-6 flex items-center justify-center font-black text-slate-400">-</button>
                            <span class="text-xs font-black w-4 text-center">${item.qty}</span>
                            <button onclick="updateQty(${idx}, 1)" class="w-6 h-6 flex items-center justify-center font-black text-amber-500">+</button>
                        </div>
                        <button onclick="removeItem(${idx})" class="p-2 text-red-400 hover:text-red-500">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" stroke-width="2"/></svg>
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function updateQty(idx, delta) {
            cart[idx].qty += delta;
            if (cart[idx].qty <= 0) cart.splice(idx, 1);
            if (cart.length === 0) toggleCart(false);
            updateUI();
        }

        function removeItem(idx) {
            cart.splice(idx, 1);
            if (cart.length === 0) toggleCart(false);
            updateUI();
        }

        function clearAllCart() {
            if (confirm("Are you sure you want to clear your entire cart?")) {
                cart = [];
                toggleCart(false);
                updateUI();
            }
        }

        function toggleScheduleInput() {
            const type = document.getElementById('scheduleType').value;
            document.getElementById('scheduleInputContainer').classList.toggle('hidden', type === 'Immediate');
        }

        function generateOrderId() {
            return Math.floor(1000000000 + Math.random() * 9000000000).toString();
        }

        function placeOrder() {
            const name = document.getElementById('orderName').value;
            const phone = document.getElementById('orderPhone').value;
            const type = document.getElementById('orderType').value;
            const scheduleType = document.getElementById('scheduleType').value;
            const scheduleTime = document.getElementById('scheduleTime').value;

            if (!name || !phone) { alert("Please enter your name and phone number!"); return; }
            if (scheduleType === 'Scheduled' && !scheduleTime) { alert("Please select a valid date and time for your order!"); return; }

            // Save user info for next time
            localStorage.setItem('deepanshu_name', name);
            localStorage.setItem('deepanshu_phone', phone);

            const orderId = generateOrderId();
            let msg = `*NEW ORDER - DEEPANSHU RESTAURANT*\n`;
            msg += `--------------------------\n`;
            msg += `*Order ID:* ${orderId}\n`;
            msg += `--------------------------\n`;
            msg += `*Name:* ${name}\n*Phone:* ${phone}\n*Order:* ${type}\n`;
            
            if (scheduleType === 'Scheduled') {
                const date = new Date(scheduleTime).toLocaleString('en-IN', { dateStyle: 'medium', timeStyle: 'short' });
                msg += `*⏰ Scheduled For:* ${date}\n`;
            } else {
                msg += `*⏰ Order For:* Immediate\n`;
            }

            msg += `--------------------------\n`;
            cart.forEach(item => { msg += `• ${item.name} (${item.variant}) x ${item.qty} = ₹${(item.price * item.qty).toFixed(2)}\n`; });
            const total = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            msg += `--------------------------\n*TOTAL: ₹${total.toFixed(2)}*\n\n_Sent via Digital Menu_`;

            // Open WhatsApp
            window.open(`https://wa.me/919910109626?text=${encodeURIComponent(msg)}`, '_blank');
            
            // Clear cart after order
            cart = [];
            toggleCart(false);
            updateUI();
        }

        function toggleCart(show) {
            document.getElementById('cartPanel').classList.toggle('open', show);
            document.getElementById('cartPanelOverlay').classList.toggle('open', show);
        }

        function scrollToCategory(id) {
            const element = document.getElementById(id);
            window.scrollTo({ top: element.offsetTop - 185, behavior: "smooth" });
        }

        function toggleSection(btn) {
            btn.nextElementSibling.classList.toggle('open');
            btn.querySelector('.rotate-icon').classList.toggle('open');
        }

        function updateActiveTab() {
            const sections = document.querySelectorAll('section');
            const pills = document.querySelectorAll('.category-pill');
            let current = "";
            sections.forEach(s => { if (pageYOffset >= s.offsetTop - 220) current = s.id; });
            pills.forEach((p, i) => {
                p.classList.toggle('active', `cat-${i}` === current);
                if (`cat-${i}` === current) p.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
            });
        }

        window.addEventListener('scroll', updateActiveTab);
        searchInput.addEventListener('input', (e) => renderMenu(e.target.value));
    </script>
</body>
</html>

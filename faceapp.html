<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FacePass Pro - Attendance System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        body { 
            font-family: 'Inter', sans-serif; 
            -webkit-tap-highlight-color: transparent;
            background-color: #f8fafc;
            user-select: none;
        }
        
        .action-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .action-card:active {
            transform: scale(0.95);
        }

        /* Scanner View for both Attendance & Registration */
        .scanner-overlay {
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 100;
            display: none;
            flex-direction: column;
        }

        #video, #reg-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform: scaleX(-1);
            pointer-events: none;
        }

        .loading-overlay {
            position: fixed; inset: 0; background: white; z-index: 200;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }

        /* Circular Face Guide */
        .face-guide {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 280px;
            height: 280px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            box-shadow: 0 0 0 1000px rgba(0, 0, 0, 0.6);
            transition: all 0.3s ease;
        }
        
        .face-guide.active {
            border-color: #3b82f6;
            box-shadow: 0 0 30px rgba(59, 130, 246, 0.5), 0 0 0 1000px rgba(0, 0, 0, 0.6);
            transform: translate(-50%, -50%) scale(1.02);
        }

        .progress-ring {
            transition: stroke-dashoffset 0.4s ease;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }
    </style>
</head>
<body>

    <!-- Startup Loading -->
    <div id="app-loading" class="loading-overlay">
        <div class="w-12 h-12 border-4 border-blue-100 border-t-blue-600 rounded-full animate-spin"></div>
        <p class="mt-4 font-semibold text-slate-600 tracking-wide">AI Models load ho rahe hain...</p>
    </div>

    <!-- Attendance Scanner View -->
    <div id="scanner-view" class="scanner-overlay">
        <video id="video" autoplay muted playsinline></video>
        <canvas id="overlay"></canvas>
        <div class="face-guide" id="att-guide"></div>

        <div class="absolute top-0 inset-x-0 p-6 flex justify-between items-center bg-gradient-to-b from-black/80 to-transparent">
            <button onclick="stopSession()" class="text-white bg-white/10 p-3 rounded-full backdrop-blur-md hover:bg-white/20 transition-all">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
            </button>
            <div class="text-center">
                <p id="scan-mode-text" class="text-white font-bold tracking-widest uppercase text-[10px]">PUNCHING...</p>
                <p id="identified-name" class="text-blue-400 font-semibold text-lg mt-0.5">Face dhund rahe hain...</p>
            </div>
            <div class="w-12"></div>
        </div>

        <div id="scan-success" class="hidden absolute bottom-20 inset-x-6 bg-green-500 p-6 rounded-3xl text-white text-center shadow-2xl animate-bounce">
            <h2 id="success-title" class="text-xl font-bold">Done!</h2>
            <p id="success-desc" class="opacity-90">Attendance lag gayi hai.</p>
        </div>
    </div>

    <!-- Registration Scanner View -->
    <div id="reg-scanner-view" class="scanner-overlay">
        <video id="reg-video" autoplay muted playsinline></video>
        <div class="face-guide" id="reg-guide"></div>
        
        <div class="absolute top-0 inset-x-0 p-6 bg-gradient-to-b from-black/80 to-transparent text-center">
            <p class="text-white font-bold uppercase text-[10px] tracking-widest">REGISTRATION SCAN</p>
            <p id="reg-feedback" class="text-blue-400 font-semibold mt-1">Camera ready ho raha hai...</p>
        </div>

        <!-- Circular Progress Bar -->
        <div class="absolute bottom-24 left-1/2 -translate-x-1/2">
            <svg width="120" height="120">
                <circle cx="60" cy="60" r="50" fill="transparent" stroke="rgba(255,255,255,0.2)" stroke-width="8"/>
                <circle id="reg-progress-ring" class="progress-ring" cx="60" cy="60" r="50" fill="transparent" stroke="#3b82f6" stroke-width="8" stroke-dasharray="314.15" stroke-dashoffset="314.15"/>
            </svg>
            <div class="absolute inset-0 flex items-center justify-center">
                <span id="reg-percent" class="text-white font-bold text-xl">0%</span>
            </div>
        </div>

        <div class="absolute bottom-10 inset-x-6">
            <button onclick="cancelRegistration()" class="w-full py-4 bg-white/10 text-white rounded-2xl font-bold backdrop-blur-md hover:bg-white/20 transition-all">Cancel Scan</button>
        </div>
    </div>

    <!-- Main Dashboard -->
    <div id="dashboard" class="min-h-screen flex flex-col">
        <header class="p-8 pb-4">
            <div class="flex justify-between items-start">
                <div>
                    <h1 class="text-3xl font-extrabold text-slate-800 tracking-tight">FacePass</h1>
                    <p class="text-slate-500 font-medium">Smart AI Attendance</p>
                </div>
                <div class="h-12 w-12 bg-blue-600 rounded-2xl flex items-center justify-center text-white shadow-lg shadow-blue-200">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10"/></svg>
                </div>
            </div>
        </header>

        <main class="flex-1 px-6 space-y-6 pt-4">
            <div class="bg-slate-900 rounded-[2.5rem] p-8 text-white shadow-2xl relative overflow-hidden">
                <div class="relative z-10">
                    <h2 id="current-time" class="text-4xl font-bold tracking-tighter">00:00:00</h2>
                    <p id="current-date" class="opacity-60 font-semibold mt-1 uppercase tracking-widest text-[10px]">Loading...</p>
                </div>
                <div class="absolute -right-8 -bottom-8 w-40 h-40 bg-blue-600/20 rounded-full blur-3xl"></div>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <button onclick="startSession('IN')" class="action-card bg-white p-6 rounded-[2.5rem] border border-slate-100 shadow-sm flex flex-col items-center gap-4 active:bg-slate-50">
                    <div class="w-14 h-14 bg-green-50 text-green-600 rounded-2xl flex items-center justify-center">
                        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
                    </div>
                    <span class="font-bold text-slate-800">Punch IN</span>
                </button>

                <button onclick="startSession('OUT')" class="action-card bg-white p-6 rounded-[2.5rem] border border-slate-100 shadow-sm flex flex-col items-center gap-4 active:bg-slate-50">
                    <div class="w-14 h-14 bg-red-50 text-red-600 rounded-2xl flex items-center justify-center">
                        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                    </div>
                    <span class="font-bold text-slate-800">Punch OUT</span>
                </button>
            </div>

            <div class="pt-4 pb-12">
                <button onclick="switchTab('register')" class="w-full p-6 bg-blue-50 border border-blue-100 rounded-[2.5rem] flex items-center justify-between group active:scale-95 transition-all">
                    <div class="flex items-center gap-4">
                        <div class="w-12 h-12 bg-blue-600 text-white rounded-xl flex items-center justify-center">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg>
                        </div>
                        <div class="text-left">
                            <span class="block font-bold text-blue-900 leading-tight">Naya User Register karein</span>
                            <span class="text-blue-600/70 text-[10px] font-bold uppercase tracking-widest">Employee Data Entry</span>
                        </div>
                    </div>
                    <svg xmlns="http://www.w3.org/2000/svg" class="text-blue-400 group-hover:translate-x-1 transition-transform" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
                </button>
            </div>
        </main>
    </div>

    <!-- Registration Form Screen -->
    <div id="tab-register" class="hidden min-h-screen bg-white">
        <div class="p-8">
            <button onclick="switchTab('dashboard')" class="mb-10 w-12 h-12 bg-slate-50 rounded-2xl flex items-center justify-center text-slate-600 active:bg-slate-200 transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
            </button>
            <h2 class="text-3xl font-extrabold text-slate-800 tracking-tight">Registration</h2>
            <p class="text-slate-500 font-medium mt-1">Employee ki details bhariye</p>
            
            <div class="mt-10 space-y-6">
                <div class="space-y-2">
                    <label class="text-[10px] font-extrabold text-slate-400 uppercase ml-2 tracking-[0.2em]">Employee ID</label>
                    <input type="text" id="reg-id" class="w-full p-5 bg-slate-50 rounded-3xl border-2 border-transparent outline-none focus:border-blue-600 focus:bg-white font-bold text-slate-800 transition-all placeholder:text-slate-300" placeholder="e.g. EMP101">
                </div>
                <div class="space-y-2">
                    <label class="text-[10px] font-extrabold text-slate-400 uppercase ml-2 tracking-[0.2em]">Full Name</label>
                    <input type="text" id="reg-name" class="w-full p-5 bg-slate-50 rounded-3xl border-2 border-transparent outline-none focus:border-blue-600 focus:bg-white font-bold text-slate-800 transition-all placeholder:text-slate-300" placeholder="e.g. Rahul Kumar">
                </div>
                
                <div class="pt-8">
                    <button onclick="initiateRegistration()" id="reg-btn" class="w-full py-6 bg-slate-900 text-white rounded-[2rem] font-bold shadow-xl shadow-slate-200 active:scale-95 transition-all flex items-center justify-center gap-3">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10"/></svg>
                        Face Scan Shuru Karein
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- APPS SCRIPT WEB APP URL ---
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw1o3sJ7l9FziD3T-DKfehMsM0lBFCTH2xXSNU7t5vuPkDRlegK5xZThDyhdZciwBw/exec"; 

        let labeledDescriptors = [];
        let faceMatcher = null;
        let activeSession = false;
        let attendanceMode = 'IN';
        let regScanning = false;
        const video = document.getElementById('video');
        const regVideo = document.getElementById('reg-video');
        const overlay = document.getElementById('overlay');

        // Clock Logic
        setInterval(() => {
            const now = new Date();
            document.getElementById('current-time').innerText = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
            document.getElementById('current-date').innerText = now.toLocaleDateString([], { weekday: 'long', day: 'numeric', month: 'short' });
        }, 1000);

        // Models Initializing
        async function init() {
            try {
                const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/';
                await Promise.all([
                    faceapi.nets.ssdMobilenetv1.loadFromUri(MODEL_URL),
                    faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
                    faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL)
                ]);
                await loadDatabase();
                document.getElementById('app-loading').style.display = 'none';
            } catch (err) {
                console.error(err);
                document.getElementById('app-loading').innerHTML = `<p class="text-red-500 font-bold">Error: Connection Check Karein.</p>`;
            }
        }

        async function loadDatabase() {
            if(!SCRIPT_URL) return;
            try {
                const res = await fetch(SCRIPT_URL);
                const data = await res.json();
                labeledDescriptors = data.map(emp => {
                    try {
                        const parsedDesc = JSON.parse(emp.FaceDescriptor);
                        const desc = new Float32Array(Object.values(parsedDesc));
                        return new faceapi.LabeledFaceDescriptors(emp.Name + "||" + emp.ID, [desc]);
                    } catch(e) { return null; }
                }).filter(i => i !== null);
                
                if (labeledDescriptors.length > 0) {
                    faceMatcher = new faceapi.FaceMatcher(labeledDescriptors, 0.45);
                }
            } catch (e) { console.error("Database loading failed:", e); }
        }

        // Attendance Module
        async function startSession(mode) {
            attendanceMode = mode;
            document.getElementById('scan-mode-text').innerText = `PUNCHING ${mode}...`;
            document.getElementById('identified-name').innerText = "Face dhund rahe hain...";
            document.getElementById('scanner-view').style.display = 'flex';
            
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } } 
                });
                video.srcObject = stream;
                activeSession = true;
                // Wait for video metadata to avoid issues
                video.onloadedmetadata = () => runRecognition();
            } catch (e) {
                alert("Camera permission block ki gayi hai.");
                stopSession();
            }
        }

        function stopSession() {
            activeSession = false;
            if (video.srcObject) {
                video.srcObject.getTracks().forEach(t => t.stop());
                video.srcObject = null;
            }
            document.getElementById('scanner-view').style.display = 'none';
            document.getElementById('scan-success').classList.add('hidden');
        }

        async function runRecognition() {
            if (!activeSession) return;

            const detections = await faceapi.detectAllFaces(video).withFaceLandmarks().withFaceDescriptors();
            const displaySize = { width: video.offsetWidth, height: video.offsetHeight };
            faceapi.matchDimensions(overlay, displaySize);
            
            const resized = faceapi.resizeResults(detections, displaySize);
            const ctx = overlay.getContext('2d');
            ctx.clearRect(0, 0, overlay.width, overlay.height);

            const guide = document.getElementById('att-guide');

            if (resized.length > 0) {
                guide.classList.add('active');
                if (faceMatcher) {
                    const result = faceMatcher.findBestMatch(resized[0].descriptor);
                    if (result.label !== 'unknown' && result.distance < 0.45) {
                        const [name, id] = result.label.split('||');
                        document.getElementById('identified-name').innerText = `Namaste, ${name}!`;
                        document.getElementById('identified-name').classList.replace('text-blue-400', 'text-green-400');
                        activeSession = false;
                        submitAttendance(id, name);
                    } else {
                        document.getElementById('identified-name').innerText = "Anjaan Vyakti";
                        document.getElementById('identified-name').classList.replace('text-green-400', 'text-blue-400');
                    }
                }
            } else {
                guide.classList.remove('active');
                document.getElementById('identified-name').innerText = "Face dhund rahe hain...";
            }

            if (activeSession) requestAnimationFrame(runRecognition);
        }

        async function submitAttendance(id, name) {
            if (!SCRIPT_URL) {
                showSuccess(`Welcome, ${name}!`, "Demo Mode: Marked.");
                return;
            }
            try {
                const res = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'attendance', id, name, type: attendanceMode })
                });
                const data = await res.json();
                if (data.status === 'success') {
                    showSuccess(`Punched ${attendanceMode}!`, `${name} ka time mark ho gaya.`);
                } else {
                    alert(data.message);
                    activeSession = true;
                    runRecognition();
                }
            } catch (e) {
                alert("Network connectivity check karein.");
                activeSession = true;
                runRecognition();
            }
        }

        function showSuccess(title, desc) {
            document.getElementById('success-title').innerText = title;
            document.getElementById('success-desc').innerText = desc;
            document.getElementById('scan-success').classList.remove('hidden');
            setTimeout(stopSession, 3500);
        }

        // Registration Module - Fixes included for Scan Logic
        async function initiateRegistration() {
            const id = document.getElementById('reg-id').value.trim();
            const name = document.getElementById('reg-name').value.trim();
            
            if(!id || !name) return alert("Pehle Employee ID aur Naam bhariye.");

            document.getElementById('reg-scanner-view').style.display = 'flex';
            const feedback = document.getElementById('reg-feedback');
            feedback.innerText = "Camera start ho raha hai...";
            
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } } 
                });
                regVideo.srcObject = stream;
                
                // CRITICAL FIX: Wait for the video to actually play before detection
                regVideo.onplay = () => {
                    regScanning = true;
                    feedback.innerText = "Chehra circle ke andar laiye";
                    processRegistration(id, name);
                };
            } catch (e) {
                alert("Camera access block hai.");
                cancelRegistration();
            }
        }

        async function processRegistration(id, name) {
            const descriptors = [];
            const progressRing = document.getElementById('reg-progress-ring');
            const percentText = document.getElementById('reg-percent');
            const guide = document.getElementById('reg-guide');
            const feedback = document.getElementById('reg-feedback');
            
            const radius = 50;
            const circumference = 2 * Math.PI * radius;
            progressRing.style.strokeDashoffset = circumference;

            // Warm up detection
            await new Promise(r => setTimeout(r, 1000));

            while (regScanning && descriptors.length < 5) {
                try {
                    // Optimized detection sensitivity
                    const detection = await faceapi.detectSingleFace(regVideo).withFaceLandmarks().withFaceDescriptor();
                    
                    if (detection) {
                        guide.classList.add('active');
                        feedback.innerText = "Sahi hai! Hold karein...";
                        feedback.classList.replace('text-blue-400', 'text-green-400');
                        
                        descriptors.push(detection.descriptor);
                        
                        // Smooth UI Update
                        const progress = descriptors.length / 5;
                        const offset = circumference - (progress * circumference);
                        progressRing.style.strokeDashoffset = offset;
                        percentText.innerText = `${Math.round(progress * 100)}%`;
                        
                        // Chota pause capture ke beech
                        await new Promise(r => setTimeout(r, 400));
                    } else {
                        guide.classList.remove('active');
                        feedback.innerText = "Chehra dhund rahe hain...";
                        feedback.classList.replace('text-green-400', 'text-blue-400');
                    }
                } catch (e) { console.error("Scan frame error:", e); }
                
                await new Promise(r => setTimeout(r, 200));
            }

            if (!regScanning) return;

            feedback.innerText = "Finalizing Data...";
            const avg = new Float32Array(128).map((_, i) => descriptors.reduce((a, b) => a + b[i], 0) / 5);
            
            try {
                feedback.innerText = "Sheet mein save ho raha hai...";
                const res = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({ 
                        action: 'register', 
                        id, 
                        name, 
                        descriptor: JSON.stringify(Object.values(avg)) 
                    })
                });
                const data = await res.json();
                if(data.status === 'success') {
                    feedback.innerText = "Registration Safal Hua!";
                    setTimeout(() => location.reload(), 2000);
                } else {
                    alert("Registration failed: " + data.message);
                    cancelRegistration();
                }
            } catch (e) {
                alert("Internet check karein aur phir koshish karein.");
                cancelRegistration();
            }
        }

        function cancelRegistration() {
            regScanning = false;
            if (regVideo.srcObject) {
                regVideo.srcObject.getTracks().forEach(t => t.stop());
                regVideo.srcObject = null;
            }
            document.getElementById('reg-scanner-view').style.display = 'none';
            // Reset Progress UI
            document.getElementById('reg-percent').innerText = "0%";
            document.getElementById('reg-progress-ring').style.strokeDashoffset = 314.15;
        }

        // Navigation Module
        function switchTab(tabId) {
            document.getElementById('dashboard').style.display = tabId === 'dashboard' ? 'flex' : 'none';
            document.getElementById('tab-register').style.display = tabId === 'register' ? 'block' : 'none';
            
            if (tabId === 'dashboard') {
                document.getElementById('reg-id').value = "";
                document.getElementById('reg-name').value = "";
            }
        }

        window.onload = init;
    </script>
</body>
</html>

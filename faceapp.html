<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FingerPass Pro - Biometric Attendance</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        body { 
            font-family: 'Inter', sans-serif; 
            -webkit-tap-highlight-color: transparent;
            background-color: #f8fafc;
            user-select: none;
        }
        
        .action-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .action-card:active {
            transform: scale(0.95);
        }

        .loading-overlay {
            position: fixed; inset: 0; background: white; z-index: 200;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }

        .fingerprint-anim {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: #eff6ff;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            margin-bottom: 20px;
        }

        .fingerprint-anim::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border: 2px solid #3b82f6;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(1.5); opacity: 0; }
        }

        .scan-modal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.8);
            z-index: 150;
            display: none;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(8px);
        }
    </style>
</head>
<body>

    <!-- Startup Loading -->
    <div id="app-loading" class="loading-overlay">
        <div class="w-12 h-12 border-4 border-blue-100 border-t-blue-600 rounded-full animate-spin"></div>
        <p class="mt-4 font-semibold text-slate-600 tracking-wide">Biometric module ready ho raha hai...</p>
    </div>

    <!-- Biometric Scan Modal -->
    <div id="scan-modal" class="scan-modal">
        <div class="bg-white rounded-[3rem] p-10 w-[90%] max-w-sm text-center shadow-2xl">
            <div class="fingerprint-anim mx-auto">
                <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12C2 6.47715 6.47715 2 12 2C17.5228 2 22 6.47715 22 12"/><path d="M5 12C5 8.13401 8.13401 5 12 5C15.866 5 19 8.13401 19 12"/><path d="M8 12C8 9.79086 9.79086 8 12 8C14.2091 8 16 9.79086 16 12"/><path d="M12 11V17"/><path d="M12 21V22"/><circle cx="12" cy="12" r="1"/></svg>
            </div>
            <h2 id="scan-title" class="text-2xl font-extrabold text-slate-800">Sensor Touch Karein</h2>
            <p id="scan-subtitle" class="text-slate-500 mt-2">Apna fingerprint verify karein</p>
            <button onclick="hideScanModal()" class="mt-8 text-slate-400 font-bold text-sm uppercase tracking-widest">Cancel</button>
        </div>
    </div>

    <!-- Main Dashboard -->
    <div id="dashboard" class="min-h-screen flex flex-col">
        <header class="p-8 pb-4">
            <div class="flex justify-between items-start">
                <div>
                    <h1 class="text-3xl font-extrabold text-slate-800 tracking-tight">FingerPass</h1>
                    <p class="text-slate-500 font-medium">Biometric Attendance</p>
                </div>
                <div class="h-12 w-12 bg-blue-600 rounded-2xl flex items-center justify-center text-white shadow-lg shadow-blue-200">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10"/></svg>
                </div>
            </div>
        </header>

        <main class="flex-1 px-6 space-y-6 pt-4">
            <div class="bg-slate-900 rounded-[2.5rem] p-8 text-white shadow-2xl relative overflow-hidden">
                <div class="relative z-10">
                    <h2 id="current-time" class="text-4xl font-bold tracking-tighter">00:00:00</h2>
                    <p id="current-date" class="opacity-60 font-semibold mt-1 uppercase tracking-widest text-[10px]">Loading...</p>
                </div>
                <div class="absolute -right-8 -bottom-8 w-40 h-40 bg-blue-600/20 rounded-full blur-3xl"></div>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <button onclick="handlePunch('IN')" class="action-card bg-white p-6 rounded-[2.5rem] border border-slate-100 shadow-sm flex flex-col items-center gap-4 active:bg-slate-50">
                    <div class="w-14 h-14 bg-green-50 text-green-600 rounded-2xl flex items-center justify-center">
                        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
                    </div>
                    <span class="font-bold text-slate-800">Punch IN</span>
                </button>

                <button onclick="handlePunch('OUT')" class="action-card bg-white p-6 rounded-[2.5rem] border border-slate-100 shadow-sm flex flex-col items-center gap-4 active:bg-slate-50">
                    <div class="w-14 h-14 bg-red-50 text-red-600 rounded-2xl flex items-center justify-center">
                        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                    </div>
                    <span class="font-bold text-slate-800">Punch OUT</span>
                </button>
            </div>

            <div class="pt-4 pb-12">
                <button onclick="switchTab('register')" class="w-full p-6 bg-blue-50 border border-blue-100 rounded-[2.5rem] flex items-center justify-between group active:scale-95 transition-all">
                    <div class="flex items-center gap-4">
                        <div class="w-12 h-12 bg-blue-600 text-white rounded-xl flex items-center justify-center">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg>
                        </div>
                        <div class="text-left">
                            <span class="block font-bold text-blue-900 leading-tight">Naya User Register karein</span>
                            <span class="text-blue-600/70 text-[10px] font-bold uppercase tracking-widest">Enroll Fingerprint</span>
                        </div>
                    </div>
                    <svg xmlns="http://www.w3.org/2000/svg" class="text-blue-400 group-hover:translate-x-1 transition-transform" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
                </button>
            </div>
        </main>
    </div>

    <!-- Registration Screen -->
    <div id="tab-register" class="hidden min-h-screen bg-white">
        <div class="p-8">
            <button onclick="switchTab('dashboard')" class="mb-10 w-12 h-12 bg-slate-50 rounded-2xl flex items-center justify-center text-slate-600 active:bg-slate-200 transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
            </button>
            <h2 class="text-3xl font-extrabold text-slate-800 tracking-tight">Enrollment</h2>
            <p class="text-slate-500 font-medium mt-1">Details bhariye aur finger scan karein</p>
            
            <div class="mt-10 space-y-6">
                <div class="space-y-2">
                    <label class="text-[10px] font-extrabold text-slate-400 uppercase ml-2 tracking-[0.2em]">Employee ID</label>
                    <input type="text" id="reg-id" class="w-full p-5 bg-slate-50 rounded-3xl border-2 border-transparent outline-none focus:border-blue-600 focus:bg-white font-bold text-slate-800 transition-all placeholder:text-slate-300" placeholder="e.g. EMP101">
                </div>
                <div class="space-y-2">
                    <label class="text-[10px] font-extrabold text-slate-400 uppercase ml-2 tracking-[0.2em]">Full Name</label>
                    <input type="text" id="reg-name" class="w-full p-5 bg-slate-50 rounded-3xl border-2 border-transparent outline-none focus:border-blue-600 focus:bg-white font-bold text-slate-800 transition-all placeholder:text-slate-300" placeholder="e.g. Rahul Kumar">
                </div>
                
                <div class="pt-8">
                    <button onclick="initiateRegistration()" id="reg-btn" class="w-full py-6 bg-slate-900 text-white rounded-[2rem] font-bold shadow-xl shadow-slate-200 active:scale-95 transition-all flex items-center justify-center gap-3">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10"/></svg>
                        Fingerprint Enroll Karein
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- APPS SCRIPT WEB APP URL ---
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw1o3sJ7l9FziD3T-DKfehMsM0lBFCTH2xXSNU7t5vuPkDRlegK5xZThDyhdZciwBw/exec"; 

        let userCredentials = []; // Database of {name, id, credentialId}
        let attendanceMode = 'IN';

        // Clock Logic
        setInterval(() => {
            const now = new Date();
            document.getElementById('current-time').innerText = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
            document.getElementById('current-date').innerText = now.toLocaleDateString([], { weekday: 'long', day: 'numeric', month: 'short' });
        }, 1000);

        async function init() {
            if (!window.PublicKeyCredential) {
                alert("Aapka browser biometric authentication support nahi karta.");
            }
            await loadDatabase();
            document.getElementById('app-loading').style.display = 'none';
        }

        async function loadDatabase() {
            if(!SCRIPT_URL) return;
            try {
                const res = await fetch(SCRIPT_URL);
                const result = await res.json();
                if(result.status === 'success') {
                    userCredentials = result.data;
                }
            } catch (e) { console.error("Database error:", e); }
        }

        // --- ATTENDANCE (PUNCH IN/OUT) ---
        async function handlePunch(mode) {
            attendanceMode = mode;
            showScanModal("Verification", `Punch ${mode} karne ke liye finger touch karein.`);
            
            try {
                // In a real environment, WebAuthn requires a challenge from a server.
                // Since this is a standalone demo, we use a fixed challenge.
                const challenge = new Uint8Array(32);
                window.crypto.getRandomValues(challenge);

                const credential = await navigator.credentials.get({
                    publicKey: {
                        challenge: challenge,
                        userVerification: "required",
                    }
                });

                if (credential) {
                    // Search database for this credential ID
                    // Note: Credential.id is the Base64 ID we saved
                    const matchedUser = userCredentials.find(u => u.FaceDescriptor === credential.id);

                    if (matchedUser) {
                        submitAttendance(matchedUser.ID, matchedUser.Name);
                    } else {
                        alert("Fingerprint toh sahi hai, par yeh user registered nahi hai.");
                        hideScanModal();
                    }
                }
            } catch (err) {
                console.error(err);
                if(err.name !== 'NotAllowedError') alert("Biometric Verification Fail: " + err.message);
                hideScanModal();
            }
        }

        async function submitAttendance(id, name) {
            document.getElementById('scan-title').innerText = "Processing...";
            document.getElementById('scan-subtitle').innerText = "Attendance mark ho rahi hai...";

            if (!SCRIPT_URL) {
                alert(`Demo: ${name} ka ${attendanceMode} mark ho gaya!`);
                hideScanModal();
                return;
            }

            try {
                const res = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'attendance', id, name, type: attendanceMode })
                });
                const data = await res.json();
                if (data.status === 'success') {
                    document.getElementById('scan-title').innerText = "Safal Hua! ✅";
                    document.getElementById('scan-subtitle').innerText = `${name} ka attendance lag gaya.`;
                    setTimeout(hideScanModal, 3000);
                } else {
                    alert(data.message);
                    hideScanModal();
                }
            } catch (e) {
                alert("Network error.");
                hideScanModal();
            }
        }

        // --- REGISTRATION (ENROLLMENT) ---
        async function initiateRegistration() {
            const id = document.getElementById('reg-id').value.trim();
            const name = document.getElementById('reg-name').value.trim();
            
            if(!id || !name) return alert("Details bhariye.");

            try {
                const challenge = new Uint8Array(32);
                window.crypto.getRandomValues(challenge);
                const userId = new Uint8Array(16);
                window.crypto.getRandomValues(userId);

                const credential = await navigator.credentials.create({
                    publicKey: {
                        challenge: challenge,
                        rp: { name: "FacePass Pro" },
                        user: {
                            id: userId,
                            name: name,
                            displayName: name
                        },
                        pubKeyCredParams: [{ alg: -7, type: "public-key" }], // ES256
                        authenticatorSelection: {
                            authenticatorAttachment: "platform",
                            userVerification: "required"
                        },
                        timeout: 60000,
                        attestation: "none"
                    }
                });

                if (credential) {
                    saveRegistration(id, name, credential.id);
                }
            } catch (err) {
                console.error(err);
                alert("Registration Error: " + err.message);
            }
        }

        async function saveRegistration(id, name, credentialId) {
            document.getElementById('reg-btn').innerText = "Saving...";
            document.getElementById('reg-btn').disabled = true;

            if (!SCRIPT_URL) {
                alert("Demo Mode: Registration Success!");
                location.reload();
                return;
            }

            try {
                const res = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({ 
                        action: 'register', 
                        id, 
                        name, 
                        descriptor: credentialId // Hum credential ID save karenge
                    })
                });
                const data = await res.json();
                if(data.status === 'success') {
                    alert("User Enroll ho gaya!");
                    location.reload();
                } else {
                    alert(data.message);
                    document.getElementById('reg-btn').innerText = "Fingerprint Enroll Karein";
                    document.getElementById('reg-btn').disabled = false;
                }
            } catch (e) {
                alert("Server Error.");
                location.reload();
            }
        }

        // --- UI UTILS ---
        function showScanModal(title, sub) {
            document.getElementById('scan-modal').style.display = 'flex';
            document.getElementById('scan-title').innerText = title;
            document.getElementById('scan-subtitle').innerText = sub;
        }

        function hideScanModal() {
            document.getElementById('scan-modal').style.display = 'none';
        }

        function switchTab(tabId) {
            document.getElementById('dashboard').style.display = tabId === 'dashboard' ? 'flex' : 'none';
            document.getElementById('tab-register').style.display = tabId === 'register' ? 'block' : 'none';
        }

        window.onload = init;
    </script>
</body>
</html>

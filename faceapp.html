<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FacePass Pro - Attendance System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        body { 
            font-family: 'Inter', sans-serif; 
            -webkit-tap-highlight-color: transparent;
            background-color: #f8fafc;
        }
        
        .action-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .action-card:active {
            transform: scale(0.95);
        }

        .scanner-view {
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 100;
            display: none;
            flex-direction: column;
        }

        #video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }

        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform: scaleX(-1);
            pointer-events: none;
        }

        .loading-overlay {
            position: fixed; inset: 0; background: white; z-index: 200;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }

        .scan-frame {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 280px;
            height: 380px;
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 3rem;
            box-shadow: 0 0 0 1000px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body>

    <!-- Startup Loading -->
    <div id="app-loading" class="loading-overlay">
        <div class="w-12 h-12 border-4 border-blue-100 border-t-blue-600 rounded-full animate-spin"></div>
        <p class="mt-4 font-semibold text-slate-600">Loading FacePass Models...</p>
    </div>

    <!-- Scanner Screen (Hidden by default) -->
    <div id="scanner-view" class="scanner-view">
        <video id="video" autoplay muted playsinline></video>
        <canvas id="overlay"></canvas>
        
        <div class="scan-frame"></div>

        <!-- Scanning Header -->
        <div class="absolute top-0 inset-x-0 p-6 flex justify-between items-center bg-gradient-to-b from-black/60 to-transparent">
            <button onclick="stopSession()" class="text-white bg-white/20 p-3 rounded-full backdrop-blur-md">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
            </button>
            <div class="text-center">
                <p id="scan-mode-text" class="text-white font-bold tracking-widest uppercase text-sm">Scanning...</p>
                <p id="identified-name" class="text-blue-400 font-medium text-lg mt-1">Looking for face...</p>
            </div>
            <div class="w-12"></div>
        </div>

        <!-- Success Toast (In-Scanner) -->
        <div id="scan-success" class="hidden absolute bottom-20 inset-x-6 bg-green-500 p-6 rounded-3xl text-white text-center shadow-2xl animate-bounce">
            <h2 id="success-title" class="text-xl font-bold">Success!</h2>
            <p id="success-desc" class="opacity-90">Attendance marked successfully.</p>
        </div>
    </div>

    <!-- Main Dashboard -->
    <div id="dashboard" class="min-h-screen flex flex-col pb-24">
        <header class="p-8">
            <h1 class="text-3xl font-extrabold text-slate-800 tracking-tight">FacePass</h1>
            <p class="text-slate-500 font-medium">Smart AI Attendance</p>
        </header>

        <main class="flex-1 px-6 space-y-6">
            <!-- Summary Card -->
            <div class="bg-blue-600 rounded-[2.5rem] p-8 text-white shadow-xl shadow-blue-100 flex justify-between items-center">
                <div>
                    <h2 id="current-time" class="text-3xl font-bold">00:00</h2>
                    <p id="current-date" class="opacity-80 text-sm">Loading...</p>
                </div>
                <div class="bg-white/20 p-4 rounded-2xl backdrop-blur-sm">
                    <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                </div>
            </div>

            <div class="grid grid-cols-1 gap-6 pt-4">
                <button onclick="startSession('IN')" class="action-card bg-white p-8 rounded-[2.5rem] border border-slate-100 shadow-sm flex flex-col items-center gap-4 hover:border-blue-200">
                    <div class="w-16 h-16 bg-green-50 text-green-600 rounded-full flex items-center justify-center">
                        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
                    </div>
                    <div class="text-center">
                        <span class="block text-xl font-bold text-slate-800">Punch IN</span>
                        <span class="text-slate-400 text-sm">Shift shuru karein</span>
                    </div>
                </button>

                <button onclick="startSession('OUT')" class="action-card bg-white p-8 rounded-[2.5rem] border border-slate-100 shadow-sm flex flex-col items-center gap-4 hover:border-red-200">
                    <div class="w-16 h-16 bg-red-50 text-red-600 rounded-full flex items-center justify-center">
                        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                    </div>
                    <div class="text-center">
                        <span class="block text-xl font-bold text-slate-800">Punch OUT</span>
                        <span class="text-slate-400 text-sm">Shift khatam karein</span>
                    </div>
                </button>
            </div>
        </main>

        <!-- Bottom Registration Link -->
        <footer class="fixed bottom-8 inset-x-8">
            <button onclick="switchTab('register')" class="w-full py-4 text-slate-500 font-bold bg-slate-100 rounded-2xl flex items-center justify-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg>
                Register New User
            </button>
        </footer>
    </div>

    <!-- Registration Screen (Separate Tab) -->
    <div id="tab-register" class="hidden min-h-screen p-8 bg-white">
        <button onclick="switchTab('dashboard')" class="mb-8 p-3 bg-slate-50 rounded-full">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
        </button>
        <h2 class="text-3xl font-bold mb-2">User Registration</h2>
        <p class="text-slate-500 mb-8">Naye user ka profile banayein</p>
        
        <div class="space-y-6">
            <input type="text" id="reg-id" class="w-full p-5 bg-slate-50 rounded-2xl outline-none focus:ring-2 focus:ring-blue-600 font-medium" placeholder="Employee ID">
            <input type="text" id="reg-name" class="w-full p-5 bg-slate-50 rounded-2xl outline-none focus:ring-2 focus:ring-blue-600 font-medium" placeholder="Full Name">
            
            <div id="reg-cam-preview" class="hidden w-full aspect-square bg-slate-100 rounded-3xl overflow-hidden relative border-2 border-dashed border-slate-300">
                <video id="reg-video" class="w-full h-full object-cover" autoplay muted playsinline></video>
                <div class="absolute bottom-4 left-1/2 -translate-x-1/2 bg-blue-600 px-4 py-2 rounded-full text-white text-xs font-bold">
                    Scanning: <span id="reg-count">0</span>/5
                </div>
            </div>

            <button onclick="startRegistration()" id="reg-btn" class="w-full py-5 bg-slate-900 text-white rounded-3xl font-bold shadow-xl">Start Face Scan</button>
        </div>
    </div>

    <script>
        // --- APPS SCRIPT URL ---
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw1o3sJ7l9FziD3T-DKfehMsM0lBFCTH2xXSNU7t5vuPkDRlegK5xZThDyhdZciwBw/exec"; 

        let labeledDescriptors = [];
        let faceMatcher = null;
        let activeSession = false;
        let attendanceMode = 'IN';
        const video = document.getElementById('video');
        const overlay = document.getElementById('overlay');

        // Update Dashboard Clock
        setInterval(() => {
            const now = new Date();
            document.getElementById('current-time').innerText = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            document.getElementById('current-date').innerText = now.toLocaleDateString([], { weekday: 'long', day: 'numeric', month: 'short' });
        }, 1000);

        // --- INIT ---
        async function init() {
            try {
                const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/';
                await Promise.all([
                    faceapi.nets.ssdMobilenetv1.loadFromUri(MODEL_URL),
                    faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
                    faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL)
                ]);
                
                await loadDatabase();
                document.getElementById('app-loading').style.display = 'none';
            } catch (err) {
                console.error(err);
                alert("Failed to load models. Check internet.");
            }
        }

        async function loadDatabase() {
            if(!SCRIPT_URL) return;
            try {
                const res = await fetch(SCRIPT_URL);
                const data = await res.json();
                labeledDescriptors = data.map(emp => {
                    const desc = new Float32Array(Object.values(JSON.parse(emp.FaceDescriptor)));
                    return new faceapi.LabeledFaceDescriptors(emp.Name + "||" + emp.ID, [desc]);
                });
                if (labeledDescriptors.length > 0) faceMatcher = new faceapi.FaceMatcher(labeledDescriptors, 0.55);
            } catch (e) { console.warn("DB Offline."); }
        }

        // --- SESSION CONTROL ---
        async function startSession(mode) {
            attendanceMode = mode;
            document.getElementById('scan-mode-text').innerText = `Punching ${mode}...`;
            document.getElementById('identified-name').innerText = "Looking for face...";
            document.getElementById('scanner-view').style.display = 'flex';
            
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
                video.srcObject = stream;
                activeSession = true;
                runRecognition();
            } catch (e) {
                alert("Camera access required.");
                stopSession();
            }
        }

        function stopSession() {
            activeSession = false;
            if (video.srcObject) {
                video.srcObject.getTracks().forEach(track => track.stop());
                video.srcObject = null;
            }
            document.getElementById('scanner-view').style.display = 'none';
            document.getElementById('scan-success').classList.add('hidden');
        }

        // --- RECOGNITION LOGIC ---
        async function runRecognition() {
            if (!activeSession) return;

            const detections = await faceapi.detectAllFaces(video).withFaceLandmarks().withFaceDescriptors();
            const displaySize = { width: video.offsetWidth, height: video.offsetHeight };
            faceapi.matchDimensions(overlay, displaySize);
            
            const resized = faceapi.resizeResults(detections, displaySize);
            const ctx = overlay.getContext('2d');
            ctx.clearRect(0, 0, overlay.width, overlay.height);

            if (resized.length > 0 && faceMatcher) {
                const result = faceMatcher.findBestMatch(resized[0].descriptor);
                
                if (result.label !== 'unknown' && result.distance < 0.45) {
                    const [name, id] = result.label.split('||');
                    document.getElementById('identified-name').innerText = `Hi, ${name}!`;
                    document.getElementById('identified-name').classList.add('text-green-400');
                    
                    // Mark Attendance
                    activeSession = false; // Pause scanning
                    submitAttendance(id, name);
                } else {
                    document.getElementById('identified-name').innerText = "Unknown Person";
                    document.getElementById('identified-name').classList.remove('text-green-400');
                }
            }

            if (activeSession) requestAnimationFrame(runRecognition);
        }

        async function submitAttendance(id, name) {
            if (!SCRIPT_URL) {
                showSuccess(`Welcome, ${name}!`, "Demo mode marked successfully.");
                return;
            }

            try {
                const res = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'attendance', id, name, type: attendanceMode })
                });
                const data = await res.json();
                
                if (data.status === 'success') {
                    showSuccess(`Punched ${attendanceMode}!`, `Entry for ${name} at ${data.time}`);
                } else {
                    alert(data.message);
                    activeSession = true;
                    runRecognition();
                }
            } catch (e) {
                alert("Submit failed.");
                activeSession = true;
                runRecognition();
            }
        }

        function showSuccess(title, desc) {
            document.getElementById('success-title').innerText = title;
            document.getElementById('success-desc').innerText = desc;
            document.getElementById('scan-success').classList.remove('hidden');
            
            setTimeout(() => {
                stopSession();
            }, 3000);
        }

        // --- REGISTRATION ---
        async function startRegistration() {
            const id = document.getElementById('reg-id').value;
            const name = document.getElementById('reg-name').value;
            if(!id || !name) return alert("Fill all fields");

            const regVideo = document.getElementById('reg-video');
            const preview = document.getElementById('reg-cam-preview');
            preview.classList.remove('hidden');
            
            const stream = await navigator.mediaDevices.getUserMedia({ video: true });
            regVideo.srcObject = stream;

            const descriptors = [];
            while (descriptors.length < 5) {
                const detection = await faceapi.detectSingleFace(regVideo).withFaceLandmarks().withFaceDescriptor();
                if (detection) {
                    descriptors.push(detection.descriptor);
                    document.getElementById('reg-count').innerText = descriptors.length;
                }
                await new Promise(r => setTimeout(r, 500));
            }

            const avg = new Float32Array(128).map((_, i) => descriptors.reduce((a, b) => a + b[i], 0) / 5);
            
            // Upload
            document.getElementById('reg-btn').innerText = "Uploading...";
            await fetch(SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify({ action: 'register', id, name, descriptor: JSON.stringify(Object.values(avg)) })
            });

            alert("Registered!");
            location.reload();
        }

        // --- NAVIGATION ---
        function switchTab(tabId) {
            document.getElementById('dashboard').style.display = tabId === 'dashboard' ? 'flex' : 'none';
            document.getElementById('tab-register').style.display = tabId === 'register' ? 'block' : 'none';
        }

        window.onload = init;
    </script>
</body>
</html>
